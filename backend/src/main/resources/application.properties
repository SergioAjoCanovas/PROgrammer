# 1. Conexión con MySQL en Aiven (Sustituye lo de localhost)
# La URL utiliza el Host y el Puerto que aparecen en tu captura de Aiven
spring.datasource.url=jdbc:mysql://mysql-c390df7-programmer-db.d.aivencloud.com:13936/defaultdb?ssl-mode=REQUIRED

# El usuario por defecto de Aiven
spring.datasource.username=avnadmin

# IMPORTANTE: Ve a la web de Aiven, dale al icono del "ojo" en Password,
# copia la clave y pégala aquí abajo.
spring.datasource.password=${DB_PASSWORD}

# 2. Configuración del Driver y Dialecto para MySQL 8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 3. Hibernate (Para que cree las tablas automáticamente basándose en tus clases @Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Tus otras configuraciones (las dejas igual)
logging.level.org.hibernate.SQL=DEBUG
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
#spring.mvc.auto-grow-collection-limit=4096
server.tomcat.max-parameter-count=10000

# Configuración de Google OAuth2 (déjala como la tenías)
spring.security.oauth2.client.registration.google.client-id=339083136548-4st47ib6tsj8dslbq64i5bk6itolmcch.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

#Despliegue
server.port=${PORT:8080}