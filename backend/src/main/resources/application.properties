# 1. Conexión con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/programmer_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# 2. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Formato de Logs (Opcional, para verlo todo más claro)
logging.level.org.hibernate.SQL=DEBUG

# Aumentamos el límite de archivos para poder subir imágenes de proyecto.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Aumentamos el límite de elementos en listas para permitir marcar todas las tecnologías
spring.mvc.auto-grow-collection-limit=4096
server.tomcat.max-parameter-count=10000

# 4. Configuración de Google OAuth2 (Rellena con tus datos de Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=339083136548-4st47ib6tsj8dslbq64i5bk6itolmcch.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile