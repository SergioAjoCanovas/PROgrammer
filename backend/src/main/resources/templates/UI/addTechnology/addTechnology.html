<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Stack - PROgrammer</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/addTechnology_styles/addTechnology_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon cuerpo-flexible">

<div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-principal-stack">
    <div class="vidrio-contenedor">

        <div class="cabecera-seccion-stack">
            <h2><i class="fas fa-layer-group"></i> Configurar Stack Tecnológico</h2>
            <a href="/ownProfile" class="boton-volver-stack" title="Cancelar">
                <i class="fas fa-times"></i>
            </a>
        </div>

        <p class="subtitulo-stack">
            Define tu arsenal técnico para destacar en la comunidad.
        </p>

        <form id="form-stack"
              class="formulario-stack"
              method="post"
              th:action="@{/usuario/saveTechnologies}">

            <fieldset class="grupo-tecnologico"
                      th:each="entry : ${tecnologiasPorCategoria}">

                <legend>
                    <i class="fas fa-layer-group"></i>
                    <span th:text="${entry.key}">Categoría</span>
                </legend>

                <div class="grid-checkboxes">

                    <label class="item-tech"
                           th:each="tech : ${entry.value}">

                        <input type="checkbox"
                        name="techIds"
                        th:value="${tech.id}">

                        <div class="caja-diseno">

                            <i th:class="${tech.icono}"></i>

                            <span th:text="${tech.nombre}">Nombre</span>

                            <div class="tick-minimalista"></div>

                        </div>

                    </label>

                </div>

            </fieldset>

            <div class="contenedor-boton">
                <button type="submit" class="boton-amarillo-solido">
                    PUBLICAR TECNOLOGÍAS
                </button>
            </div>

        </form>

    </div>
</main>

<div th:replace="~{includes/footer :: footer}"></div>

</body>
</html>
