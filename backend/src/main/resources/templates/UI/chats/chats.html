<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Chats</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/chats_styles/chats_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon"
      th:attr="data-user1=${user1}, data-user2=${user2 != null ? user2 : ''}">

<div th:replace="~{includes/header :: header}"></div>

<div class="contenedor-volver">
    <a href="/main" class="enlace-volver">
        <i class="fas fa-arrow-left"></i> Volver a inicio
    </a>
</div>

<main class="contenedor-principal-chats">
    <section class="tarjeta-chats border-neon">

        <!-- LISTA -->
        <aside class="panel-contactos">

            <div class="cabecera-contactos">
                <h2><i class="fas fa-comments"></i> Mensajes</h2>
            </div>

            <div class="lista-conversaciones" id="listaChats"></div>

        </aside>

        <!-- CHAT -->
        <section class="panel-conversacion">

            <div class="cabecera-chat-activo">
                <div class="info-usuario-activo">
                    <img id="chatAvatar" class="avatar-pequeno" src="/Img/default-avatar.png">

                    <div>
                        <h3 id="chatNombre">Chat</h3>
                        <span class="subtitulo-estado">Selecciona una conversación</span>
                    </div>
                </div>
            </div>

            <div class="area-mensajes" id="chatBox">
                <p style="opacity:0.5; text-align:center; margin-top:20px;">
                    Selecciona un chat para empezar
                </p>
            </div>

            <div class="zona-input-chat">
                <input type="text" id="mensajeInput" placeholder="Escribe un mensaje...">

                <button class="btn-enviar neon-button" onclick="enviarMensaje()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

        </section>

    </section>
</main>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>

const chatBox = document.getElementById("chatBox");
const listaChats = document.getElementById("listaChats");

const user1 = Number(document.body.dataset.user1 || 0);

let user2 = document.body.dataset.user2 && document.body.dataset.user2 !== ""
    ? Number(document.body.dataset.user2)
    : null;


// =====================
// WEBSOCKET
// =====================
const socket = new SockJS('/ws');
const stompClient = Stomp.over(socket);

stompClient.connect({}, function () {

    stompClient.subscribe('/topic/messages/' + user1, function (message) {

    const mensaje = JSON.parse(message.body);
    pintarMensaje(mensaje);
    });

});


// =====================
// HELPERS
// =====================
function hayChatActivo() {
    return user1 > 0 && user2 > 0;
}


// =====================
// PINTAR MENSAJE (ÚNICO)
// =====================
function pintarMensaje(m) {

    const esMio = m.emisorId === user1;

    // si NO es el chat activo → solo actualizamos lista (no chat)
    if (!user2 || (m.emisorId !== user2 && m.receptorId !== user2)) {
        marcarChatConMensaje(m);
        return;
    }

    // evitar duplicados visuales (simple pero efectivo)
    const div = document.createElement("div");
    div.className = "mensaje " + (esMio ? "enviado" : "recibido");

    div.innerHTML = `
        <div class="burbuja">
            <p>${m.contenido}</p>
            <span class="hora-mensaje">
                ${new Date(m.fechaEnvio).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
            </span>
        </div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    // mover chat arriba en lista
    moverChatArriba(m);
}


// =====================
// CHAT ARRIBA + BADGE (base)
// =====================
function moverChatArriba(m) {

    const items = [...listaChats.children];

    const item = items.find(el =>
        el.dataset.userid == m.emisorId || el.dataset.userid == m.receptorId
    );

    if (!item) return;

    listaChats.prepend(item);
}


// =====================
// MARCAR CHAT CON MENSAJE (placeholder visual)
// =====================
function marcarChatConMensaje(m) {

    const items = [...listaChats.children];

    const item = items.find(el =>
        el.dataset.userid == m.emisorId || el.dataset.userid == m.receptorId
    );

    if (!item) return;

    item.classList.add("chat-pendiente"); // amarillo (CSS luego)
    listaChats.prepend(item);
}


// =====================
// CARGAR MENSAJES
// =====================
async function cargarMensajes() {

    if (!hayChatActivo()) {
        chatBox.innerHTML = "<p style='opacity:0.5;text-align:center'>Selecciona un chat</p>";
        return;
    }

    const res = await fetch(`/chat/${user1}/${user2}`);
    if (!res.ok) return;

    const mensajes = await res.json();

    chatBox.innerHTML = "";

    mensajes.forEach(m => {

        const esMio = m.emisorId === user1;

        const div = document.createElement("div");
        div.className = "mensaje " + (esMio ? "enviado" : "recibido");

        div.innerHTML = `
            <div class="burbuja">
                <p>${m.contenido}</p>
                <span class="hora-mensaje">
                    ${new Date(m.fechaEnvio).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                </span>
            </div>
        `;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}


// =====================
// ENVIAR MENSAJE
// =====================
async function enviarMensaje() {

    if (!hayChatActivo()) {
        alert("Selecciona un chat primero");
        return;
    }

    const input = document.getElementById("mensajeInput");
    const texto = input.value.trim();

    if (!texto) return;

    await fetch(`/chat/send?emisorId=${user1}&receptorId=${user2}&contenido=${encodeURIComponent(texto)}`, {
        method: "POST"
    });

    input.value = "";

    // NO recargamos (WebSocket lo hace)
}


// =====================
// CAMBIAR CHAT
// =====================
function cambiarChat(nuevoUser2, nombre, avatar) {

    if (!nuevoUser2) return;

    user2 = Number(nuevoUser2);
    if (isNaN(user2)) return;

    document.getElementById("chatNombre").innerText = nombre;
    document.getElementById("chatAvatar").src = avatar || '/Img/default-avatar.png';

    // 🔥 LIMPIAR NOTIFICACIÓN VISUAL
    limpiarNoLeido(user2);

    cargarMensajes();
}

function limpiarNoLeido(userId) {

    const items = [...listaChats.children];

    const item = items.find(el =>
        el.dataset.userid == userId
    );

    if (!item) return;

    item.classList.remove("chat-pendiente");
}


// =====================
// LISTA DE CHATS
// =====================
async function cargarChats() {

    if (!user1) return;

    const res = await fetch(`/chat/amigos/${user1}`);
    if (!res.ok) return;

    const chats = await res.json();

    listaChats.innerHTML = "";

    chats.forEach(c => {

        const div = document.createElement("div");
        div.className = "item-chat";

        div.dataset.userid = c.userId;

        div.onclick = () => cambiarChat(
            c.userId,
            c.username,
            c.fotoPerfil
        );

        div.innerHTML = `
            <div class="avatar-chat">
                <img src="${c.fotoPerfil || '/Img/default-avatar.png'}">
            </div>

            <div class="info-chat">
                <h4>${c.username}</h4>
            </div>
        `;

        listaChats.appendChild(div);
    });

    if (chats.length > 0 && !hayChatActivo()) {
        const first = chats[0];

        cambiarChat(
            first.userId,
            first.username,
            first.fotoPerfil
        );
    }
}


// ENTER
document.getElementById("mensajeInput").addEventListener("keypress", e => {
    if (e.key === "Enter") enviarMensaje();
});


// INIT
cargarChats();

if (hayChatActivo()) {
    cargarMensajes();
}
</script>

</body>
</html>
