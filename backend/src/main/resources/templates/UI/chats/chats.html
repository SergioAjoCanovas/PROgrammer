<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Chats</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/chats_styles/chats_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon"
      th:attr="data-user1=${user1}, 
               data-user2=${user2 != null ? user2 : ''},
               data-user2-name=${receptorNombre != null ? receptorNombre : ''},
               data-user2-avatar=${receptorAvatar != null ? receptorAvatar : ''}">

<div th:replace="~{includes/header :: header}"></div>

<div class="contenedor-volver">
    <a href="/main" class="enlace-volver">
        <i class="fas fa-arrow-left"></i> Volver a inicio
    </a>
</div>

<main class="contenedor-principal-chats">
    <section class="tarjeta-chats border-neon">

        <!-- LISTA -->
        <aside class="panel-contactos">

            <div class="cabecera-contactos">
                <h2><i class="fas fa-comments"></i> Mensajes</h2>
            </div>

            <div class="lista-conversaciones" id="listaChats"></div>

        </aside>

        <!-- CHAT -->
        <section class="panel-conversacion">

            <div class="cabecera-chat-activo">

                <div class="info-usuario-activo">
                    <img id="chatAvatar" class="avatar-pequeno"
                    src="/Img/default-avatar.png"
                    onerror="this.src='/Img/stock/default-profile.svg'">
            
                    <div>
                        <h3 id="chatNombre">Chat</h3>
                        <span class="subtitulo-estado">Selecciona una conversación</span>
                    </div>
                </div>
            
                <div class="acciones-chat">
                    <button onclick="vaciarChat()" title="Vaciar chat">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            
            </div>

            <div class="area-mensajes" id="chatBox">
                <div class="chat-vacio-placeholder">
                    <i class="fas fa-comments"></i>
                    <h2>Tus Mensajes</h2>
                    <p>Selecciona una conversación de la lista para empezar a chatear.</p>
                </div>
            </div>

            <div class="zona-input-chat">
                <input type="text" id="mensajeInput" placeholder="Escribe un mensaje...">

                <button class="btn-enviar neon-button" onclick="enviarMensaje()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

        </section>

    </section>
</main>

<div id="chat-modal-vaciar" class="chat-modal-overlay chat-hidden">

    <div class="chat-modal">
        <h3>Vaciar chat</h3>

        <p>¿Seguro que quieres vaciar este chat? Esta acción no se puede deshacer.</p>

        <div class="chat-modal-botones">
            <button class="chat-btn-cancelar" onclick="cerrarModalVaciarChat()">
                Cancelar
            </button>

            <button class="chat-btn-confirmar" onclick="confirmarVaciarChat()">
                Vaciar
            </button>
        </div>
    </div>

</div>

<div id="chat-toast" class="chat-toast">

    <i class="fas fa-check-circle"></i>
    <span id="chat-toast-msg">Mensaje</span>

</div>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>

const chatBox = document.getElementById("chatBox");
const listaChats = document.getElementById("listaChats");

const user1 = Number(document.body.dataset.user1 || 0);

let user2 = document.body.dataset.user2 && document.body.dataset.user2 !== ""
    ? Number(document.body.dataset.user2)
    : null;


// =====================
// WEBSOCKET
// =====================
const socket = new SockJS('/ws');
const stompClient = Stomp.over(socket);

stompClient.connect({}, function () {

    stompClient.subscribe('/topic/messages/' + user1, function (message) {

    const mensaje = JSON.parse(message.body);
    pintarMensaje(mensaje);
    });

});


// =====================
// HELPERS
// =====================
function hayChatActivo() {
    return user1 > 0 && user2 > 0;
}


// =====================
// PINTAR MENSAJE (ÚNICO)
// =====================
function pintarMensaje(m) {
    cargarMensajes();
    cargarChats();
}

// =====================
// CARGAR MENSAJES
// =====================
async function cargarMensajes() {

    if (!hayChatActivo()) {
        chatBox.innerHTML = `
            <div class="chat-vacio-placeholder">
                <i class="fas fa-comments"></i>
                <h2>Tus Mensajes</h2>
                <p>Selecciona una conversación para empezar.</p>
            </div>
        `;
        return;
    }

    const res = await fetch(`/chat/${user1}/${user2}`);
    if (!res.ok) return;

    const mensajes = await res.json();

    chatBox.innerHTML = "";

    let ultimaFecha = null;

    mensajes.forEach(m => {

        const fechaMensaje = new Date(m.fechaEnvio);
        const diaActual = fechaMensaje.toDateString();

        if (diaActual !== ultimaFecha) {

            const separador = document.createElement("div");
            separador.className = "chat-fecha-separador";

            separador.innerText = obtenerDia(m.fechaEnvio);

            chatBox.appendChild(separador);

            ultimaFecha = diaActual;
        }

        const esMio = m.emisorId === user1;

        const div = document.createElement("div");
        div.className = "mensaje " + (esMio ? "enviado" : "recibido");

        div.innerHTML = `
            <div class="burbuja">
                <p>${m.contenido}</p>
                <span class="hora-mensaje">
                    ${fechaMensaje.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                </span>
            </div>
        `;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

function actualizarPreviewChat(m) {

    const id = m.emisorId === user1 ? m.receptorId : m.emisorId;

    const item = [...listaChats.children]
        .find(el => Number(el.dataset.userid) === Number(id));

    if (!item) return;

    // mover arriba
    listaChats.prepend(item);

    // marcar no leído si NO es chat activo
    if (id !== user2) {
        item.classList.add("chat-pendiente");
    } else {
        item.classList.remove("chat-pendiente");
    }
}


// =====================
// ENVIAR MENSAJE
// =====================
async function enviarMensaje() {

    if (!hayChatActivo()) {
        mostrarToast("Selecciona un chat primero");
        return;
    }

    const input = document.getElementById("mensajeInput");
    const texto = input.value.trim();

    if (!texto) return;

    await fetch(`/chat/send?emisorId=${user1}&receptorId=${user2}&contenido=${encodeURIComponent(texto)}`, {
        method: "POST"
    });

    input.value = "";

    // NO recargamos (WebSocket lo hace)
}


// =====================
// CAMBIAR CHAT
// =====================
async function cambiarChat(nuevoUser2, nombre, avatar) {

    if (!nuevoUser2) return;

    user2 = Number(nuevoUser2);
    if (isNaN(user2)) return;

    document.getElementById("chatNombre").innerText = nombre;
    document.getElementById("chatAvatar").src = avatar || '/Img/default-avatar.png';

    await fetch(`/chat/marcar-leidos?userId=${user1}&otroId=${user2}`, {
        method: "POST"
    });

    await cargarChats();

    const item = document.querySelector(`[data-userid="${user2}"]`);
    if (item) {
        item.classList.remove("chat-pendiente");
    }

    cargarMensajes();
}

function limpiarNoLeido(userId) {

    const items = [...listaChats.children];

    const item = items.find(el =>
        el.dataset.userid == userId
    );

    if (!item) return;

    item.classList.remove("chat-pendiente");
}


// =====================
// LISTA DE CHATS
// =====================
async function cargarChats() {

    if (!user1) return;

    const res = await fetch(`/chat/list/${user1}`);
    if (!res.ok) return;

    const chats = await res.json();

    listaChats.innerHTML = "";

    chats.forEach(c => {

        const div = document.createElement("div");
        div.className = "item-chat";

        div.dataset.userid = c.userId;

        if (c.noLeidos > 0) {
            div.classList.add("chat-pendiente");
        }

        div.onclick = () => cambiarChat(
            c.userId,
            c.username,
            c.fotoPerfil
        );

        div.innerHTML = `
            <div class="avatar-chat">
                <img src="${c.fotoPerfil || '/Img/default-avatar.png'}">
            </div>

            <div class="info-chat">
                <h4>${c.username}</h4>

                <p class="preview-mensaje">
                    ${c.ultimoMensaje || ""}
                </p>
            </div>

            ${c.noLeidos > 0 ? `
                <span class="badge-no-leido">${c.noLeidos}</span>
            ` : ""}
        `;

        listaChats.appendChild(div);
    });
}

// =====================
// VACIAR CHATS
// =====================
function vaciarChat() {

if (!user2) {
    mostrarToast("Selecciona un chat primero");
    return;
}

document.getElementById("chat-modal-vaciar")
    .classList.remove("chat-hidden");
}

function cerrarModalVaciarChat() {
document.getElementById("chat-modal-vaciar")
    .classList.add("chat-hidden");
}

async function confirmarVaciarChat() {

await fetch(`/chat/vaciar?userId=${user1}&otroId=${user2}`, {
    method: "POST"
});

cerrarModalVaciarChat();

chatBox.innerHTML = "<p style='opacity:0.5;text-align:center'>Chat vaciado</p>";

mostrarToast("Chat vaciado correctamente");

cargarMensajes();
cargarChats();
}

function mostrarToast(mensaje) {

    const toast = document.getElementById("chat-toast");
    const msg = document.getElementById("chat-toast-msg");

    msg.innerText = mensaje;

    toast.classList.add("mostrar");

    setTimeout(() => {
        toast.classList.remove("mostrar");
    }, 2500);
}

function obtenerDia(fecha) {

    const d = new Date(fecha);

    return d.toLocaleDateString('es-ES', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

// =====================
// CARGAR FECHAS EN TIEMPO REAL
// =====================

async function cargarMensajes() {

    if (!hayChatActivo()) {
        chatBox.innerHTML = `
            <div class="chat-vacio-placeholder">
                <i class="fas fa-comments"></i>
                <h2>Tus Mensajes</h2>
                <p>Selecciona una conversación para empezar.</p>
            </div>
        `;
        return;
    }

    const res = await fetch(`/chat/${user1}/${user2}`);
    if (!res.ok) return;

    const mensajes = await res.json();

    renderizarMensajes(mensajes);
}

function renderizarMensajes(mensajes) {

    chatBox.innerHTML = "";

    let ultimaFecha = null;

    mensajes.forEach(m => {

        const fecha = new Date(m.fechaEnvio);
        const dia = fecha.toDateString();

        // separador de día
        if (dia !== ultimaFecha) {

            const separador = document.createElement("div");
            separador.className = "chat-fecha-separador";
            separador.innerText = obtenerDia(m.fechaEnvio);

            chatBox.appendChild(separador);

            ultimaFecha = dia;
        }

        const esMio = m.emisorId === user1;

        const div = document.createElement("div");
        div.className = "mensaje " + (esMio ? "enviado" : "recibido");

        div.innerHTML = `
            <div class="burbuja">
                <p>${m.contenido}</p>
                <span class="hora-mensaje">
                    ${fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                </span>
            </div>
        `;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}


// ENTER
document.getElementById("mensajeInput").addEventListener("keypress", e => {
    if (e.key === "Enter") enviarMensaje();
});


// INIT
cargarChats();

if (hayChatActivo()) {
    const preName = document.body.dataset.user2Name;
    const preAvatar = document.body.dataset.user2Avatar;

    if (preName) {
        document.getElementById("chatNombre").innerText = preName;
        document.querySelector(".subtitulo-estado").innerText = "Chateando ahora";
    }
    if (preAvatar && preAvatar !== "") {
        document.getElementById("chatAvatar").src = preAvatar;
    }

    cargarMensajes();
}
</script>

</body>
</html>
