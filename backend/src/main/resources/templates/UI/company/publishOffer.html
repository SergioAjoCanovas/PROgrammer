<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${oferta != null} ? 'ProGrammer - Editar Oferta' : 'ProGrammer - Publicar Oferta'">ProGrammer - Publicar Oferta</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/company_styles/publishOffer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .activo, header .navegacion-central a.activo i, header .navegacion-central a.activo span { 
            color: #FFCC00 !important; 
            text-shadow: 0 0 10px #FFCC00 !important; 
            opacity: 1 !important; 
        }
        .seccion-categoria { margin-bottom: 25px; background: rgba(25, 25, 25, 0.6); padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .titulo-categoria-form { color: #00f2ff; font-size: 1.1rem; margin-bottom: 15px; border-left: 3px solid #FFCC00; padding-left: 10px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .grid-tecnologias { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .check-tech { display: flex; align-items: center; gap: 8px; color: #ddd; font-size: 0.9rem; cursor: pointer; padding: 5px; border-radius: 4px; transition: all 0.3s ease; }
        .check-tech:hover { background: rgba(0, 242, 255, 0.1); color: white; }

        /* BOTONES TOGGLE TECH (Marcar/Desmarcar) - EXACTOS DE ADD TECHNOLOGY */
        .btn-tech-toggle {
            background: transparent;
            padding: 6px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* MARCAR (Cyan) */
        .btn-tech-marcar {
            color: #00f3ff;
            border: 2px solid #00f3ff;
        }
        .btn-tech-marcar:hover, .btn-tech-marcar.btn-activo {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
            transform: scale(1.05);
        }

        /* DESMARCAR (Rojo) */
        .btn-tech-desmarcar {
            color: #ff4444;
            border: 2px solid #ff4444;
        }
        .btn-tech-desmarcar:hover, .btn-tech-desmarcar.btn-activo {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 0 20px #ff4444;
            transform: scale(1.05);
        }

        .botones-categoria-tech {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <div class="contenedor-volver">
        <a id="btn-dinamico-volver" href="/main" class="enlace-volver">
            <i class="fas fa-arrow-left"></i> <span id="texto-btn-volver">Volver a inicio</span>
        </a>
    </div>

    <main class="contenedor-principal-oferta">
        <section class="tarjeta-publicacion">
            <div class="cabecera-tarjeta">
                <h2 th:text="${oferta != null} ? 'Editar Oferta de Empleo' : 'Nueva Oferta de Empleo'">
                    <i class="fas fa-bullhorn"></i> Nueva Oferta
                </h2>
                <p style="color: #aaa; margin-top: 5px;">Define los detalles para encontrar al candidato ideal</p>
            </div>

            <form th:action="@{/api/ofertas/crear}" method="POST" class="formulario-oferta">
                <input type="hidden" name="id" th:value="${oferta?.id}">
                <input type="hidden" id="username_empresa" name="username_empresa" value="">

                <div class="grupo-input">
                    <label for="titulo"><i class="fas fa-signature"></i> Título del Puesto</label>
                    <input type="text" id="titulo" name="titulo" class="input-neon" 
                           th:value="${oferta?.titulo}" 
                           placeholder="Ej: Desarrollador Backend Senior (Java)" required>
                </div>

                <div class="grupo-input">
                    <label for="descripcion"><i class="fas fa-file-alt"></i> Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="input-neon textarea-oferta textarea-grande" 
                              th:text="${oferta?.descripcion}" rows="4" 
                              placeholder="Describe las funciones principales y los objetivos de la posición..." required></textarea>
                </div>

                <div class="grupo-input">
                    <label for="requisitos"><i class="fas fa-list-check"></i> Requisitos</label>
                    <textarea id="requisitos" name="requisitos" class="input-neon textarea-oferta textarea-mediano" 
                              th:text="${oferta?.requisitos}" rows="5"
                              placeholder="Indica las tecnologías, años de experiencia y aptitudes necesarias..."></textarea>
                </div>

                <div class="grupo-input">
                    <label for="ofrecemos"><i class="fas fa-gift"></i> ¿Qué ofrecemos?</label>
                    <textarea id="ofrecemos" name="ofrecemos" class="input-neon textarea-oferta textarea-mediano" 
                              th:text="${oferta?.ofrecemos}" rows="5"
                              placeholder="Describe los beneficios: tipo de contrato, flexibilidad, retos del equipo..."></textarea>
                </div>

                <div class="grupo-input">
                    <label for="rango_salarial"><i class="fas fa-money-bill-wave"></i> Rango Salarial</label>
                    <input type="text" id="rango_salarial" name="rango_salarial" class="input-neon" 
                           th:value="${oferta?.rangoSalarial}"
                           placeholder="Ej: 35.000€ - 45.000€ o A convenir">
                </div>

                <div class="grupo-input">
                    <label><i class="fas fa-layer-group"></i> Tecnologías Requeridas</label>
                    
                    <!-- BOTONES GLOBALES -->
                    <div class="botones-globales-tech" style="display: flex; gap: 15px; margin-bottom: 20px; justify-content: flex-start;">
                        <button type="button" id="btn-global-marcar" class="btn-tech-toggle btn-tech-marcar" onclick="toggleAllTechs(true)">
                            <i class="fas fa-check-double"></i> Marcar todas
                        </button>
                        <button type="button" id="btn-global-desmarcar" class="btn-tech-toggle btn-tech-desmarcar" onclick="toggleAllTechs(false)">
                            <i class="fas fa-times"></i> Desmarcar todas
                        </button>
                    </div>

                    <script th:inline="javascript">
                        /*<![CDATA[*/
                        const techIdsPreseleccionadas = /*[[${techIdsActuales != null ? techIdsActuales : '[]'}]]*/ [];
                        /*]]>*/
                    </script>
                    <div id="contenedor-tecnologias">
                        <span style="color: #666;"><i class="fas fa-spinner fa-spin"></i> Cargando...</span>
                    </div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn-publicar-neon">
                        <i th:class="${oferta != null} ? 'fas fa-save' : 'fas fa-paper-plane'"></i> 
                        <span th:text="${oferta != null} ? ' Guardar Cambios' : ' Lanzar Oferta'"></span>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {

            // --- NUEVO SCRIPT DEL BOTON VOLVER ---
            const urlAnterior = document.referrer || "";
            const btnVolver = document.getElementById('btn-dinamico-volver');
            const textoVolver = document.getElementById('texto-btn-volver');

            // Si venimos de la vista de mis ofertas, modificamos el botón
            if (urlAnterior.toLowerCase().includes('misofertas') || urlAnterior.toLowerCase().includes('mis-ofertas')) {
                textoVolver.textContent = 'Volver a mis ofertas';
                btnVolver.href = 'javascript:history.back()'; // Para que vuelva exactamente a donde estaba
            } else {
                // Si viene de otro lado, se queda como está (vuelve a /main)
                textoVolver.textContent = 'Volver a inicio';
                btnVolver.href = '/main';
            }
            // -------------------------------------

            const n = localStorage.getItem('usuarioLogueado'); 
            if (n) document.getElementById('username_empresa').value = n;
            
            const r = localStorage.getItem('rolUsuario') || 'EMPRESA'; 
            const c = document.getElementById('info-usuario');
            if (n && c) { 
                c.innerHTML = `<div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;"><span style="color: white; font-weight: bold; font-size: 0.85em;">${n.toUpperCase()}</span><span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${r.toUpperCase()}</span></div>`; 
            }
            
            const l = document.getElementById('nav-publicar-oferta'); 
            if (l) l.classList.add('activo');
            
            cargarTecnologiasDesdeBD();
        });

        function cargarTecnologiasDesdeBD() {
            fetch('/api/categorias/todas').then(res => res.json()).then(categorias => {
                const contenedor = document.getElementById('contenedor-tecnologias'); 
                contenedor.innerHTML = ''; 
                categorias.forEach(cat => {
                    const div = document.createElement('div'); 
                    div.className = 'seccion-categoria';
                    div.innerHTML = `
                        <div class="titulo-categoria-form">
                            <span>${cat.nombre}</span>
                            <div class="botones-categoria-tech">
                                <button type="button" class="btn-tech-toggle btn-tech-marcar btn-cat-marcar" onclick="toggleCategory(this, true)">
                                    <i class="fas fa-check"></i> Todos
                                </button>
                                <button type="button" class="btn-tech-toggle btn-tech-desmarcar btn-cat-desmarcar" onclick="toggleCategory(this, false)">
                                    <i class="fas fa-times"></i> Ninguno
                                </button>
                            </div>
                        </div>
                    `;
                    const grid = document.createElement('div'); 
                    grid.className = 'grid-tecnologias';
                    
                    cat.tecnologias.forEach(tech => {
                        // Lógica para marcar los checkboxes si estamos editando
                        const ck = techIdsPreseleccionadas.includes(tech.id) ? 'checked' : '';
                        const label = document.createElement('label'); 
                        label.className = 'check-tech'; 
                        label.innerHTML = `
                            <input type="checkbox" name="tecnologias_ids" value="${tech.id}" ${ck}>
                            <span><i class="${tech.icono || 'fas fa-code'}"></i> ${tech.nombre}</span>
                        `;
                        grid.appendChild(label);
                    });
                    
                    div.appendChild(grid); 
                    contenedor.appendChild(div);
                });

                // Una vez cargadas, inicializar estados y eventos
                updateButtonStates();
                document.querySelectorAll('#contenedor-tecnologias input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', updateButtonStates);
                });
            });
        }

        function updateButtonStates() {
            const allCheckboxes = document.querySelectorAll('#contenedor-tecnologias input[type="checkbox"]');
            if (allCheckboxes.length === 0) return;

            const allCheckedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
            const totalCount = allCheckboxes.length;
            
            const btnGlobalMarcar = document.getElementById('btn-global-marcar');
            const btnGlobalDesmarcar = document.getElementById('btn-global-desmarcar');
            
            if (btnGlobalMarcar && btnGlobalDesmarcar) {
                if (totalCount > 0 && allCheckedCount === totalCount) {
                    btnGlobalMarcar.classList.add('btn-activo');
                    btnGlobalDesmarcar.classList.remove('btn-activo');
                } else {
                    btnGlobalMarcar.classList.remove('btn-activo');
                    btnGlobalDesmarcar.classList.add('btn-activo');
                }
            }

            document.querySelectorAll('.seccion-categoria').forEach(seccion => {
                const checkboxes = seccion.querySelectorAll('input[type="checkbox"]');
                const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
                const total = checkboxes.length;
                
                const btnMarcar = seccion.querySelector('.btn-cat-marcar');
                const btnDesmarcar = seccion.querySelector('.btn-cat-desmarcar');
                
                if (btnMarcar && btnDesmarcar) {
                    if (total > 0 && checkedCount === total) {
                        btnMarcar.classList.add('btn-activo');
                        btnDesmarcar.classList.remove('btn-activo');
                    } else {
                        btnMarcar.classList.remove('btn-activo');
                        btnDesmarcar.classList.add('btn-activo');
                    }
                }
            });
        }

        function toggleAllTechs(check) {
            document.querySelectorAll('#contenedor-tecnologias input[type="checkbox"]').forEach(cb => {
                cb.checked = check;
            });
            updateButtonStates();
        }

        function toggleCategory(btn, check) {
            const seccion = btn.closest('.seccion-categoria');
            if (seccion) {
                seccion.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = check;
                });
                updateButtonStates();
            }
        }
    </script>
</body>
</html>
