<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Publicar Oferta</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/company_styles/publishOffer.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* COPIADO DE RED/EMPLEOS PARA MANTENER LA CONSISTENCIA */
        .activo, 
        header .navegacion-central a.activo i, 
        header .navegacion-central a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
            opacity: 1 !important;
        }
        
        .seccion-categoria {
            margin-bottom: 25px;
            background: rgba(25, 25, 25, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .titulo-categoria-form {
            color: #00f2ff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-left: 3px solid #FFCC00;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-tecnologias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .check-tech {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ddd;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .check-tech:hover {
            background: rgba(0, 242, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-oferta">
        <section class="tarjeta-publicacion">
            <div class="cabecera-tarjeta">
                <h2><i class="fas fa-bullhorn"></i> Nueva Oferta de Empleo</h2>
                <p style="color: #aaa; margin-top: 5px;">Publica los detalles para atraer a los mejores programadores</p>
            </div>

            <form th:action="@{/api/ofertas/crear}" method="POST" class="formulario-oferta">
                <input type="hidden" id="username_empresa" name="username_empresa" value="">

                <div class="grupo-input">
                    <label for="titulo"><i class="fas fa-signature"></i> Título del Puesto</label>
                    <input type="text" id="titulo" name="titulo" class="input-neon" placeholder="Ej: Desarrollador Fullstack Junior" required>
                </div>

                <div class="grupo-input">
                    <label for="descripcion"><i class="fas fa-file-alt"></i> Descripción Breve</label>
                    <textarea id="descripcion" name="descripcion" class="input-neon textarea-oferta" rows="3" required></textarea>
                </div>

                <div class="grupo-input">
                    <label for="requisitos"><i class="fas fa-list-check"></i> Requisitos</label>
                    <textarea id="requisitos" name="requisitos" class="input-neon textarea-oferta" rows="4"></textarea>
                </div>

                <div class="grupo-input">
                    <label for="ofrecemos"><i class="fas fa-gift"></i> ¿Qué ofrecemos?</label>
                    <textarea id="ofrecemos" name="ofrecemos" class="input-neon textarea-oferta" rows="4"></textarea>
                </div>

                <div class="grupo-input">
                    <label for="rango_salarial"><i class="fas fa-money-bill-wave"></i> Rango Salarial</label>
                    <input type="text" id="rango_salarial" name="rango_salarial" class="input-neon" placeholder="Ej: 30.000€ - 45.000€">
                </div>

                <div class="grupo-input">
                    <label><i class="fas fa-layer-group"></i> Tecnologías Requeridas</label>
                    <div id="contenedor-tecnologias">
                        <span style="color: #666; font-size: 0.9rem;"><i class="fas fa-spinner fa-spin"></i> Cargando tecnologías...</span>
                    </div>
                </div>

                <div class="acciones-formulario" style="display: flex; gap: 15px; margin-top: 20px;">
                    <a th:href="@{/main}" class="btn-cancelar" style="padding: 12px 20px; background: #333; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Descartar</a>
                    <button type="submit" class="btn-publicar-neon" style="flex: 1;">
                        <i class="fas fa-paper-plane"></i> Lanzar Oferta
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const miNombre = localStorage.getItem('usuarioLogueado');
            if (miNombre) {
                document.getElementById('username_empresa').value = miNombre;
            }
            actualizarMiUsuarioEnHeader();
            cargarTecnologiasDesdeBD();
            
            // Lanzamos la iluminación con un pequeño delay para que el header cargue
            setTimeout(marcarLinkActivo, 100);
        });

        function actualizarMiUsuarioEnHeader() {
            const miNombre = localStorage.getItem('usuarioLogueado');
            const miRol = localStorage.getItem('rolUsuario') || 'EMPRESA';
            const contenedorHeader = document.getElementById('info-usuario');
            if (miNombre && contenedorHeader) {
                contenedorHeader.innerHTML = `
                    <div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;">
                        <span style="color: white; font-weight: bold; font-size: 0.85em;">${miNombre.toUpperCase()}</span>
                        <span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${miRol.toUpperCase()}</span>
                    </div>
                `;
            }
        }

        // FUNCIÓN MEJORADA PARA ILUMINAR EL BOTÓN DE PUBLICAR
        function marcarLinkActivo() {
            // Buscamos el botón por su ID
            const btnPublicar = document.getElementById('nav-publicar-oferta');
            if (btnPublicar) {
                btnPublicar.classList.add('activo');
            } else {
                // Si no hay ID, buscamos por la URL
                const path = window.location.pathname;
                const enlaces = document.querySelectorAll('header a');
                enlaces.forEach(enlace => {
                    if (enlace.getAttribute('href')?.includes('publishOffer')) {
                        enlace.classList.add('activo');
                    }
                });
            }
        }

        function cargarTecnologiasDesdeBD() {
            fetch('/api/categorias/todas') 
                .then(res => res.json())
                .then(categorias => {
                    const contenedor = document.getElementById('contenedor-tecnologias');
                    contenedor.innerHTML = ''; 
                    categorias.forEach(cat => {
                        const divCategoria = document.createElement('div');
                        divCategoria.className = 'seccion-categoria';
                        const titulo = document.createElement('h3');
                        titulo.className = 'titulo-categoria-form';
                        titulo.innerText = cat.nombre;
                        divCategoria.appendChild(titulo);
                        const grid = document.createElement('div');
                        grid.className = 'grid-tecnologias';
                        cat.tecnologias.forEach(tech => {
                            const label = document.createElement('label');
                            label.className = 'check-tech'; 
                            label.innerHTML = `<input type="checkbox" name="tecnologias_ids" value="${tech.id}"><span>${tech.nombre}</span>`;
                            grid.appendChild(label);
                        });
                        divCategoria.appendChild(grid);
                        contenedor.appendChild(divCategoria);
                    });
                });
        }
    </script>
</body>
</html>
