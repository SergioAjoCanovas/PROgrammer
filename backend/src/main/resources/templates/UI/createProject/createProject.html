<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Crear Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/createProject_styles/createProject_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .grupo-categoria {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(10, 10, 10, 0.6); /* Fondo oscuro */
        }
        
        .titulo-categoria {
            color: #00f3ff; /* Color cyan */
            font-size: 0.95rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #FFCC00; /* Raya amarilla a la izquierda */
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .grid-tecnologias {
            display: grid;
            /* Crea columnas automáticas que ocupen al menos 140px */
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px 10px;
        }

        .item-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-check:hover {
            color: #FFCC00;
        }

        /* Estilo para los iconos de las tecnologías */
        .tech-icon {
            color: #FFCC00;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* Checkbox base */
        .item-check input[type="checkbox"] {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: #FFCC00;
            margin: 0;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div class="bolas-fondo">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
    </div>

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-edicion">
        <section class="tarjeta-edicion">
            <div class="cabecera-edicion">
                <h2><i class="fas fa-plus-circle"></i> Nuevo Proyecto</h2>
                <button class="boton-volver" onclick="window.history.back()" title="Cancelar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="formProyecto" action="/proyectos/crear" method="post" enctype="multipart/form-data">

                <div class="campo">
                    <label>Imágenes del Proyecto</label>
                
                    <div class="grid-imagenes">
                
                        <div class="img-box">
                            <div class="img-placeholder" id="ph1"><i class="fas fa-plus"></i></div>
                            <img id="preview1">
                            <input type="file" name="imagenes" accept="image/*" onchange="previewImg(event, 'preview1', 'ph1')">
                        </div>
                
                        <div class="img-box">
                            <div class="img-placeholder" id="ph2"><i class="fas fa-plus"></i></div>
                            <img id="preview2">
                            <input type="file" name="imagenes" accept="image/*" onchange="previewImg(event, 'preview2', 'ph2')">
                        </div>
                
                        <div class="img-box">
                            <div class="img-placeholder" id="ph3"><i class="fas fa-plus"></i></div>
                            <img id="preview3">
                            <input type="file" name="imagenes" accept="image/*" onchange="previewImg(event, 'preview3', 'ph3')">
                        </div>
                
                        <div class="img-box">
                            <div class="img-placeholder" id="ph4"><i class="fas fa-plus"></i></div>
                            <img id="preview4">
                            <input type="file" name="imagenes" accept="image/*" onchange="previewImg(event, 'preview4', 'ph4')">
                        </div>
                
                    </div>
                </div>

                <div class="campo">
                    <label>Título del Proyecto</label>
                    <input type="text" name="titulo" placeholder="Ej. Sistema de Gestión de Inventarios" required>
                </div>

                <div class="campo">
                    <label>Descripción del Proyecto</label>
                    <textarea name="descripcion" placeholder="Describe brevemente de qué trata tu proyecto..." rows="5" required></textarea>
                </div>

                <div class="campo">
                    <label style="margin-bottom: 15px; display: block;"><i class="fas fa-layer-group" style="color: #FFCC00; margin-right: 5px;"></i> Tecnologías Requeridas</label>
                    
                    <div id="contenedor-tecnologias">
                        <p style="color: gray; font-size: 0.8rem; text-align: center; padding: 20px;">Cargando tecnologías desde la base de datos...</p>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label><i class="fab fa-github"></i> Enlace al Repositorio</label>
                        <input type="url" name="repoUrl" placeholder="https://github.com/tu-usuario/repo">
                    </div>
                    <div class="campo">
                        <label><i class="fas fa-globe"></i> Enlace a la Demo</label>
                        <input type="url" name="demoUrl" placeholder="https://tu-proyecto.vercel.app">
                    </div>
                </div>

                <div class="contenedor-botones">
                    <button type="submit" class="btn-guardar" id="btnSubmit">
                        <i class="fas fa-rocket"></i> Publicar Proyecto
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        let enviando = false;
        
        // -------------------- INIT --------------------
        $(document).ready(function() {
            if (typeof actualizarMiUsuarioEnHeader === "function") {
                actualizarMiUsuarioEnHeader();
            }
            cargarTecnologiasAgrupadas();
        });
        
        // -------------------- TOAST --------------------
        function mostrarToast(msg, tipo = "success") {
            const toast = document.getElementById("toast");
        
            toast.className = "toast";
            toast.classList.add(tipo === "error" ? "toast-error" : "toast-success");
        
            toast.innerText = msg;
            toast.classList.add("show");
        
            setTimeout(() => toast.classList.remove("show"), 4000);
        }
        
        // -------------------- VALIDACIÓN IMAGEN --------------------
        function validarImagen(file) {
            if (!file) return true;
        
            const maxSize = 2 * 1024 * 1024; // 2MB
            const allowed = ["image/jpeg", "image/png", "image/webp"];
        
            if (!allowed.includes(file.type)) {
                mostrarToast("Formato de imagen no permitido", "error");
                return false;
            }
        
            if (file.size > maxSize) {
                mostrarToast("Una imagen supera los 2MB", "error");
                return false;
            }
        
            return true;
        }
        
        // -------------------- SUBMIT CONTROLADO --------------------
        document.getElementById("formProyecto").addEventListener("submit", function(e) {
            if (enviando) {
                e.preventDefault();
                return;
            }
        
            const titulo = document.querySelector("[name='titulo']").value.trim();
            const desc = document.querySelector("[name='descripcion']").value.trim();
        
            if (!titulo || !desc) {
                e.preventDefault();
                mostrarToast("Rellena título y descripción", "error");
                return;
            }
        
            // validar imágenes
            const inputs = document.querySelectorAll("input[type='file']");
            for (let input of inputs) {
                if (input.files[0] && !validarImagen(input.files[0])) {
                    e.preventDefault();
                    return;
                }
            }
        
            enviando = true;
            document.getElementById("btnSubmit").disabled = true;
            mostrarToast("Publicando proyecto...", "success");
        });
        
        // -------------------- TECNOLOGÍAS --------------------
        function cargarTecnologiasAgrupadas() {
            $.ajax({
                url: '/api/categorias/todas',
                type: 'GET',
                success: function(categorias) {
        
                    const contenedor = $('#contenedor-tecnologias');
                    contenedor.empty();
        
                    categorias.forEach(function(categoria) {
        
                        if (!categoria.tecnologias?.length) return;
        
                        let html = `
                            <div class="grupo-categoria">
                                <div class="titulo-categoria">${categoria.nombre}</div>
                                <div class="grid-tecnologias">
                        `;
        
                        categoria.tecnologias.forEach(function(tech) {
        
                            const icon = tech.icono
                                ? `<i class="${tech.icono} tech-icon"></i>`
                                : `<i class="fas fa-code tech-icon"></i>`;
        
                            html += `
                                <label class="item-check">
                                    <input type="checkbox" name="tecnologias" value="${tech.id}">
                                    ${icon}
                                    <span>${tech.nombre}</span>
                                </label>
                            `;
                        });
        
                        html += `</div></div>`;
                        contenedor.append(html);
                    });
                },
                error: function() {
                    mostrarToast("Error al cargar tecnologías", "error");
                }
            });
        }
        
        // -------------------- PREVIEW IMAGEN --------------------
        function previewImg(event, imgId, placeholderId) {
            const file = event.target.files[0];
        
            if (!validarImagen(file)) {
                event.target.value = "";
                return;
            }
        
            if (!file) return;
        
            const reader = new FileReader();
        
            reader.onload = function() {
                const img = document.getElementById(imgId);
                img.src = reader.result;
                img.style.display = "block";
        
                document.getElementById(placeholderId).style.display = "none";
            };
        
            reader.readAsDataURL(file);
        }
        
        // -------------------- DRAG & DROP --------------------
        document.querySelectorAll(".img-box").forEach(box => {
        
            box.addEventListener("dragover", e => {
                e.preventDefault();
                box.style.border = "2px solid #FFCC00";
            });
        
            box.addEventListener("dragleave", () => {
                box.style.border = "2px dashed #FFCC00";
            });
        
            box.addEventListener("drop", e => {
                e.preventDefault();
        
                const file = e.dataTransfer.files[0];
                const input = box.querySelector("input[type='file']");
        
                if (!file || !validarImagen(file)) return;
        
                const dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
        
                input.dispatchEvent(new Event("change"));
            });
        });
        </script>

    <script th:if="${error != null}">
        document.addEventListener("DOMContentLoaded", function () {

            let mensaje = /*[[${error}]]*/ null;

            if (mensaje === "FILE_TOO_LARGE") {
                mensaje = "Una imagen es demasiado grande";
            }

            mostrarToast(mensaje, "error");
        });
    </script>
</body>
</html>
