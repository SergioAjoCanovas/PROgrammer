<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Crear Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/createProject_styles/createProject_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .grupo-categoria {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(10, 10, 10, 0.6); 
        }
        
        .titulo-categoria {
            color: #00f3ff; 
            font-size: 0.95rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #FFCC00; 
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .grid-tecnologias {
            display: grid;
            
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px 10px;
        }

        .item-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-check:hover {
            color: #FFCC00;
        }

        
        .tech-icon {
            color: #FFCC00;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        
        .item-check input[type="checkbox"] {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: #FFCC00;
            margin: 0;
        }

        
        .btn-tech-toggle {
            background: transparent;
            padding: 6px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        
        .btn-tech-marcar {
            color: #00f3ff;
            border: 2px solid #00f3ff;
        }
        .btn-tech-marcar:hover, .btn-tech-marcar.btn-activo {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
            transform: scale(1.05);
        }

        
        .btn-tech-desmarcar {
            color: #ff4444;
            border: 2px solid #ff4444;
        }
        .btn-tech-desmarcar:hover, .btn-tech-desmarcar.btn-activo {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 0 20px #ff4444;
            transform: scale(1.05);
        }

        .botones-categoria-tech {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div class="bolas-fondo">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
    </div>

    <div th:replace="~{includes/header :: header}"></div>

    <div class="contenedor-volver">
        <a href="javascript:window.history.back()" class="enlace-volver">
            <i class="fas fa-arrow-left"></i> <span id="texto-volver-dinamico">Volver</span>
        </a>
    </div>

    <main class="contenedor-principal-edicion">
        <section class="tarjeta-edicion">
            <div class="cabecera-edicion">
                <h2>
                    <i class="fas"
                       th:classappend="${proyecto != null} ? 'fa-edit' : 'fa-plus-circle'"></i>
                
                    <span th:text="${proyecto != null} ? 'Editar Proyecto' : 'Nuevo Proyecto'">
                        Nuevo Proyecto
                    </span>
                </h2>
                <button class="boton-volver" onclick="window.history.back()" title="Cancelar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="formProyecto" th:action="${proyecto?.id != null} ? @{/proyectos/editar} : @{/proyectos/crear}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${proyecto != null ? proyecto.id : ''}">

                <div class="campo">
                    <label>Imágenes del Proyecto</label>
                
                    <div class="grid-imagenes">

                        <div class="img-box">
                            <div class="img-placeholder" id="ph1"><i class="fas fa-plus"></i></div>
                    
                            <img id="preview1"
                                 th:src="${proyecto?.foto1}"
                                 th:style="${proyecto?.foto1 != null ? 'display:block' : 'display:none'}">
                    
                            <input type="file" name="imagenes" accept="image/*"
                                   onchange="previewImg(event, 'preview1', 'ph1')">
                        </div>
                    
                        <div class="img-box">
                            <div class="img-placeholder" id="ph2"><i class="fas fa-plus"></i></div>
                    
                            <img id="preview2"
                                 th:src="${proyecto?.foto2}"
                                 th:style="${proyecto?.foto2 != null ? 'display:block' : 'display:none'}">
                    
                            <input type="file" name="imagenes" accept="image/*"
                                   onchange="previewImg(event, 'preview2', 'ph2')">
                        </div>
                    
                        <div class="img-box">
                            <div class="img-placeholder" id="ph3"><i class="fas fa-plus"></i></div>
                    
                            <img id="preview3"
                                 th:src="${proyecto?.foto3}"
                                 th:style="${proyecto?.foto3 != null ? 'display:block' : 'display:none'}">
                    
                            <input type="file" name="imagenes" accept="image/*"
                                   onchange="previewImg(event, 'preview3', 'ph3')">
                        </div>
                    
                        <div class="img-box">
                            <div class="img-placeholder" id="ph4"><i class="fas fa-plus"></i></div>
                    
                            <img id="preview4"
                                 th:src="${proyecto?.foto4}"
                                 th:style="${proyecto?.foto4 != null ? 'display:block' : 'display:none'}">
                    
                            <input type="file" name="imagenes" accept="image/*"
                                   onchange="previewImg(event, 'preview4', 'ph4')">
                        </div>
                    
                    </div>
                </div>

                <div class="campo">
                    <label>
                        Título del Proyecto
                        <span id="char-counter-titulo" style="margin-left: 10px; font-size: 0.8rem; color: #888;">0 / 30</span>
                    </label>
                    <input type="text" id="titulo-proyecto" name="titulo" placeholder="Ej. Sistema de Gestión de Inventarios" 
                           th:value="${proyecto != null ? proyecto.titulo : ''}" required>
                </div>
                
                <div class="campo">
                    <label>
                        Descripción del Proyecto 
                        <span id="char-counter-desc" style="margin-left: 10px; font-size: 0.8rem; color: #888;">0 / 750</span>
                    </label>
                    <textarea id="descripcion-proyecto" name="descripcion" placeholder="Describe brevemente de qué trata tu proyecto..." rows="5" 
                              th:text="${proyecto != null ? proyecto.descripcion : ''}" required></textarea>
                </div>

                <div class="campo">
                    <label style="margin-bottom: 15px; display: block;">
                        <i class="fas fa-layer-group" style="color: #FFCC00; margin-right: 5px;"></i> Tecnologías Requeridas
                        <span id="contador-tech" style="color: #00f3ff; font-size: 0.9em; margin-left: 10px; font-weight: bold;">(0/40)</span>
                    </label>
                    
                    <div id="contenedor-tecnologias">
                        <p style="color: gray; font-size: 0.8rem; text-align: center; padding: 20px;">Cargando tecnologías desde la base de datos...</p>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label><i class="fab fa-github"></i> Enlace al Repositorio</label>
                        <input type="url" name="repoUrl" placeholder="https://github.com/tu-usuario/repo" 
                               th:value="${proyecto != null && proyecto.repoUrl != null ? proyecto.repoUrl : ''}">
                    </div>
                </div>

                <div class="contenedor-botones">
                    <button type="submit" class="btn-guardar" id="btnSubmit">
                        <i class="fas fa-rocket"></i>
                        Publicar Proyecto
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script th:inline="javascript">
        let enviando = false;
    
        // IMPORTANTE: Thymeleaf puede inyectar null si es create
        const seleccionadas =  [];
        const techSeleccionadasSafe = Array.isArray(seleccionadas) ? seleccionadas : [];
    
        // -------------------- INIT --------------------
        $(document).ready(function () {
    
            if (typeof actualizarMiUsuarioEnHeader === "function") {
                actualizarMiUsuarioEnHeader();
            }

            // --- LÓGICA PARA EL TEXTO DEL BOTÓN VOLVER ---
            const referrerURL = document.referrer.toLowerCase();
            const textoVolver = document.getElementById("texto-volver-dinamico");
            const inputTitulo = document.querySelector("input[name='titulo']").value.trim();

            if (referrerURL.includes("profile") || referrerURL.includes("perfil")) {
                textoVolver.innerText = "Volver a tu perfil";
            } else if (referrerURL.includes("project") || referrerURL.includes("proyecto") || referrerURL.includes("view")) {
                if (inputTitulo) {
                    textoVolver.innerText = "Volver a " + inputTitulo;
                } else {
                    textoVolver.innerText = "Volver al proyecto";
                }
            } else {
                textoVolver.innerText = "Volver";
            }
            // ---------------------------------------------
    
            cargarTecnologiasAgrupadas();
    
            // Si vienes de editar y hay imágenes ya cargadas
            if (typeof mostrarImagenesExistentes === "function") {
                mostrarImagenesExistentes();
            }
            // --- LÓGICA DE CONTADOR DE CARACTERES ---
            const descTextarea = document.getElementById("descripcion-proyecto");
            const counterSpan = document.getElementById("char-counter-desc");
            const maxChars = 750;

            function updateCounter() {
                const currentLength = descTextarea.value.length;
                counterSpan.innerText = `${currentLength} / ${maxChars}`;
                
                if (currentLength > maxChars) {
                    counterSpan.style.color = '#ff4444';
                    counterSpan.style.textShadow = '0 0 10px #ff4444';
                } else {
                    counterSpan.style.color = '#888';
                    counterSpan.style.textShadow = 'none';
                }
            }

            descTextarea.addEventListener('input', updateCounter);
            updateCounter(); // Inicializar

            // --- LÓGICA DE CONTADOR PARA TÍTULO ---
            const tituloInput = document.getElementById("titulo-proyecto");
            const tituloCounter = document.getElementById("char-counter-titulo");
            const maxTitulo = 30;

            function updateTituloCounter() {
                const len = tituloInput.value.length;
                tituloCounter.innerText = `${len} / ${maxTitulo}`;
                if (len > maxTitulo) {
                    tituloCounter.style.color = '#ff4444';
                    tituloCounter.style.textShadow = '0 0 10px #ff4444';
                } else {
                    tituloCounter.style.color = '#888';
                    tituloCounter.style.textShadow = 'none';
                }
            }

            tituloInput.addEventListener('input', updateTituloCounter);
            updateTituloCounter();
        });
    
        // -------------------- TOAST --------------------
        function mostrarToast(msg, tipo = "success") {
            const toast = document.getElementById("toast");
    
            toast.className = "toast";
            toast.classList.add(tipo === "error" ? "toast-error" : "toast-success");
    
            toast.innerText = msg;
            toast.classList.add("show");
    
            setTimeout(() => toast.classList.remove("show"), 4000);
        }
    
        // -------------------- VALIDACIÓN IMAGEN --------------------
        function validarImagen(file) {
            if (!file) return true;
    
            const maxSize = 2 * 1024 * 1024; // 2MB
            const allowed = ["image/jpeg", "image/png", "image/webp"];
    
            if (!allowed.includes(file.type)) {
                mostrarToast("Formato de imagen no permitido", "error");
                return false;
            }
    
            if (file.size > maxSize) {
                mostrarToast("Una imagen supera los 2MB", "error");
                return false;
            }
    
            return true;
        }
    
        // -------------------- SUBMIT CONTROLADO --------------------
        document.getElementById("formProyecto").addEventListener("submit", function (e) {
    
            if (enviando) {
                e.preventDefault();
                return;
            }
    
            const tituloInput = document.getElementById("titulo-proyecto");
            const titulo = tituloInput.value.trim();
            const desc = document.getElementById("descripcion-proyecto").value.trim();
    
            if (!titulo || !desc) {
                e.preventDefault();
                mostrarToast("Rellena título y descripción", "error");
                return;
            }

            if (titulo.length > 30) {
                e.preventDefault();
                mostrarToast("El título no puede superar los 30 caracteres", "error");
                return;
            }

            if (desc.length > 750) {
                e.preventDefault();
                mostrarToast("La descripción no puede superar los 750 caracteres", "error");
                return;
            }
    
            const inputs = document.querySelectorAll("input[type='file']");
            for (let input of inputs) {
                if (input.files[0] && !validarImagen(input.files[0])) {
                    e.preventDefault();
                    return;
                }
            }

            const selectedTechs = document.querySelectorAll("input[name='tecnologias']:checked").length;
            if (selectedTechs > 40) {
                e.preventDefault();
                mostrarToast("El máximo de tecnologías es 40", "error");
                return;
            }
    
            enviando = true;
            document.getElementById("btnSubmit").disabled = true;
            mostrarToast("Publicando proyecto...", "success");
        });
    
        // -------------------- TECNOLOGÍAS --------------------
        function cargarTecnologiasAgrupadas() {
    
            $.ajax({
                url: '/api/categorias/todas',
                type: 'GET',
                success: function (categorias) {
    
                    const contenedor = $('#contenedor-tecnologias');
                    contenedor.empty();
    
                    categorias.forEach(function (categoria) {
    
                        if (!categoria.tecnologias?.length) return;
    
                        let html = `
                            <div class="grupo-categoria">
                                <div class="titulo-categoria" style="display: flex; justify-content: space-between; align-items: center; padding-right: 5px;">
                                    <span>${categoria.nombre}</span>
                                    <div class="botones-categoria-tech">
                                        <button type="button" class="btn-tech-toggle btn-tech-marcar btn-cat-marcar" onclick="toggleCategory(this, true)">
                                            <i class="fas fa-check"></i> Todos
                                        </button>
                                        <button type="button" class="btn-tech-toggle btn-tech-desmarcar btn-cat-desmarcar" onclick="toggleCategory(this, false)">
                                            <i class="fas fa-times"></i> Ninguno
                                        </button>
                                    </div>
                                </div>
                                <div class="grid-tecnologias">
                        `;
    
                        categoria.tecnologias.forEach(function (tech) {
    
                            const icon = tech.icono
                                ? `<i class="${tech.icono} tech-icon"></i>`
                                : `<i class="fas fa-code tech-icon"></i>`;
    
                            const checked = techSeleccionadasSafe.map(Number).includes(Number(tech.id))
                                ? "checked"
                                : "";
    
                            html += `
                                <label class="item-check">
                                    <input type="checkbox" name="tecnologias" value="${tech.id}" ${checked}>
                                    ${icon}
                                    <span>${tech.nombre}</span>
                                </label>
                            `;
                        });
    
                        html += `</div></div>`;
                        contenedor.append(html);
                    });

                    // Inicializar estados y eventos
                    updateButtonStates();
                    $('#contenedor-tecnologias input[type="checkbox"]').on('change', updateButtonStates);
                },
                error: function () {
                    mostrarToast("Error al cargar tecnologías", "error");
                }
            });
        }

        function updateButtonStates() {
            const allCheckboxes = $('#contenedor-tecnologias input[type="checkbox"]');
            if (allCheckboxes.length > 0) {
                const totalChecked = allCheckboxes.filter(':checked').length;
                const contadorSpan = document.getElementById('contador-tech');
                if (contadorSpan) {
                    contadorSpan.innerText = `(${totalChecked}/40)`;
                    if (totalChecked > 40) {
                        contadorSpan.style.color = '#ff4444'; // Rojo si supera
                        contadorSpan.style.textShadow = '0 0 10px #ff4444';
                    } else {
                        contadorSpan.style.color = '#00f3ff'; // Cian si está bien
                        contadorSpan.style.textShadow = 'none';
                    }
                }
            }

            $('.grupo-categoria').each(function() {
                const checkboxes = $(this).find('input[type="checkbox"]');
                if (checkboxes.length === 0) return;

                const checkedCount = checkboxes.filter(':checked').length;
                const total = checkboxes.length;
                
                const btnMarcar = $(this).find('.btn-cat-marcar')[0];
                const btnDesmarcar = $(this).find('.btn-cat-desmarcar')[0];
                
                if (btnMarcar && btnDesmarcar) {
                    if (total > 0 && checkedCount === total) {
                        btnMarcar.classList.add('btn-activo');
                        btnDesmarcar.classList.remove('btn-activo');
                    } else {
                        btnMarcar.classList.remove('btn-activo');
                        btnDesmarcar.classList.add('btn-activo');
                    }
                }
            });
        }

        function toggleCategory(btn, check) {
            $(btn).closest('.grupo-categoria').find('input[type="checkbox"]').prop('checked', check);
            updateButtonStates();
        }
    
        // -------------------- PREVIEW IMAGEN --------------------
        function previewImg(event, imgId, placeholderId) {

            const file = event.target.files[0];

            if (!file) return;

            if (!validarImagen(file)) {
                event.target.value = "";
                return;
            }

            const img = document.getElementById(imgId);
            if (!img) return; // 👈 AQUÍ VA ESTE CHECK

            const reader = new FileReader();

            reader.onload = function () {
                img.src = reader.result;
                img.style.display = "block";

                document.getElementById(placeholderId).style.display = "none";
            };

            reader.readAsDataURL(file);
        }
    
        // -------------------- DRAG & DROP --------------------
        document.querySelectorAll(".img-box").forEach(box => {
    
            box.addEventListener("dragover", e => {
                e.preventDefault();
                box.style.border = "2px solid #FFCC00";
            });
    
            box.addEventListener("dragleave", () => {
                box.style.border = "2px dashed #FFCC00";
            });
    
            box.addEventListener("drop", e => {
                e.preventDefault();
    
                const file = e.dataTransfer.files[0];
                const input = box.querySelector("input[type='file']");
    
                if (!file || !validarImagen(file)) return;
    
                const dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
    
                input.dispatchEvent(new Event("change"));
            });
        });
    </script>

    <script th:if="${error != null}">
        document.addEventListener("DOMContentLoaded", function () {

            let mensaje =  null;

            if (mensaje === "FILE_TOO_LARGE") {
                mensaje = "Una imagen es demasiado grande";
            }

            mostrarToast(mensaje, "error");
        });

        function mostrarImagenesExistentes() {

            const img1 = document.getElementById("preview1");
            const img2 = document.getElementById("preview2");
            const img3 = document.getElementById("preview3");
            const img4 = document.getElementById("preview4");

            if (img1.src && img1.src.length > 0) {
                img1.style.display = "block";
                document.getElementById("ph1").style.display = "none";
            }

            if (img2.src && img2.src.length > 0) {
                img2.style.display = "block";
                document.getElementById("ph2").style.display = "none";
            }

            if (img3.src && img3.src.length > 0) {
                img3.style.display = "block";
                document.getElementById("ph3").style.display = "none";
            }

            if (img4.src && img4.src.length > 0) {
                img4.style.display = "block";
                document.getElementById("ph4").style.display = "none";
            }
        }
    </script>
</body>
</html>
