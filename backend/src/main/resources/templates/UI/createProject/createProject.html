<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Crear Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/createProject_styles/createProject_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .grupo-categoria {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(10, 10, 10, 0.6); /* Fondo oscuro */
        }
        
        .titulo-categoria {
            color: #00f3ff; /* Color cyan */
            font-size: 0.95rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #FFCC00; /* Raya amarilla a la izquierda */
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .grid-tecnologias {
            display: grid;
            /* Crea columnas automáticas que ocupen al menos 140px */
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px 10px;
        }

        .item-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-check:hover {
            color: #FFCC00;
        }

        /* Estilo para los iconos de las tecnologías */
        .tech-icon {
            color: #FFCC00;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* Checkbox base */
        .item-check input[type="checkbox"] {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: #FFCC00;
            margin: 0;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div class="bolas-fondo">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
    </div>

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-edicion">
        <section class="tarjeta-edicion">
            <div class="cabecera-edicion">
                <h2><i class="fas fa-plus-circle"></i> Nuevo Proyecto</h2>
                <button class="boton-volver" onclick="window.history.back()" title="Cancelar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form action="/proyectos/crear" method="post">

                <div class="campo">
                    <label>Imagen de portada</label>
                    <div class="portada-contenedor">
                        <img src="https://via.placeholder.com/800x400/1a1a1a/FFCC00?text=Haz+clic+para+subir+portada" id="preview-img" alt="Vista previa">
                        <div class="overlay-subir-portada">
                            <label for="file-upload"><i class="fas fa-cloud-upload-alt"></i></label>
                            <input type="file" id="file-upload" accept="image/*" hidden>
                        </div>
                    </div>
                </div>

                <div class="campo">
                    <label>Título del Proyecto</label>
                    <input type="text" name="titulo" placeholder="Ej. Sistema de Gestión de Inventarios" required>
                </div>

                <div class="campo">
                    <label>Descripción del Proyecto</label>
                    <textarea name="descripcion" placeholder="Describe brevemente de qué trata tu proyecto..." rows="5" required></textarea>
                </div>

                <div class="campo">
                    <label style="margin-bottom: 15px; display: block;"><i class="fas fa-layer-group" style="color: #FFCC00; margin-right: 5px;"></i> Tecnologías Requeridas</label>
                    
                    <div id="contenedor-tecnologias">
                        <p style="color: gray; font-size: 0.8rem; text-align: center; padding: 20px;">Cargando tecnologías desde la base de datos...</p>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label><i class="fab fa-github"></i> Enlace al Repositorio</label>
                        <input type="url" name="repoUrl" placeholder="https://github.com/tu-usuario/repo">
                    </div>
                    <div class="campo">
                        <label><i class="fas fa-globe"></i> Enlace a la Demo</label>
                        <input type="url" name="demoUrl" placeholder="https://tu-proyecto.vercel.app">
                    </div>
                </div>

                <div class="contenedor-botones">
                    <button type="submit" class="btn-guardar">
                        <i class="fas fa-rocket"></i> Publicar Proyecto
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            if (typeof actualizarMiUsuarioEnHeader === "function") {
                actualizarMiUsuarioEnHeader();
            }
            inicializarPreviewImagen();
            cargarTecnologiasAgrupadas(); // Llamada a tu API de Categorías
        });

       // --- CARGAR TECNOLOGÍAS AGRUPADAS DESDE API ---
        function cargarTecnologiasAgrupadas() {
            $.ajax({
                url: '/api/categorias/todas', 
                type: 'GET',
                success: function(categorias) {
                    const contenedor = $('#contenedor-tecnologias');
                    contenedor.empty(); 
                    
                    categorias.forEach(function(categoria) {
                        if (categoria.tecnologias && categoria.tecnologias.length > 0) {
                            
                            let htmlCaja = `
                                <div class="grupo-categoria">
                                    <div class="titulo-categoria">${categoria.nombre}</div>
                                    <div class="grid-tecnologias">
                            `;
                            
                            categoria.tecnologias.forEach(function(tech) {
                                const iconoHtml = tech.icono ? `<i class="${tech.icono} tech-icon"></i>` : `<i class="fas fa-code tech-icon"></i>`;
                                
                                htmlCaja += `
                                    <label class="item-check">
                                        <input type="checkbox" name="tecnologias" value="${tech.id}">
                                        <span class="custom-check"></span> ${iconoHtml}
                                        <span>${tech.nombre}</span>
                                    </label>
                                `;
                            });
                            
                            htmlCaja += `
                                    </div>
                                </div>
                            `;
                            
                            contenedor.append(htmlCaja);
                        }
                    });
                },
                error: function() {
                    $('#contenedor-tecnologias').html('<p style="color: #ff003c; text-align: center;">Error al cargar las tecnologías desde el servidor.</p>');
                }
            });
        }

        // --- PREVIEW DE IMAGEN ---
        function inicializarPreviewImagen() {
            const fileInput = document.getElementById('file-upload');
            const previewImg = document.getElementById('preview-img');

            if (fileInput && previewImg) {
                fileInput.addEventListener('change', function() {
                    const file = this.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            previewImg.setAttribute('src', e.target.result);
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }
        }
    </script>
</body>
</html>
