<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Editar Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/createProject_styles/createProject_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="fondo-oscuro-neon">

    <div class="bolas-fondo">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
    </div>

    <div th:replace="includes/header :: header"></div>

    <main class="contenedor-principal-edicion">
        <section class="tarjeta-edicion">
            <div class="cabecera-edicion">
                <h2><i class="fas fa-edit"></i> Editar Proyecto</h2>
                <button class="boton-volver" onclick="window.history.back()" title="Cancelar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="form-editar">
                <div class="campo">
                    <label>Imagen de portada</label>
                    <div class="portada-contenedor">
                        <img src="/Img/stock/ejemplo2.jpg" id="preview-img" alt="Vista previa">
                        <div class="overlay-subir-portada">
                            <label for="file-upload"><i class="fas fa-camera"></i></label>
                            <input type="file" id="file-upload" accept="image/*" hidden>
                        </div>
                    </div>
                </div>

                <div class="campo">
                    <label>Título del Proyecto</label>
                    <input type="text" placeholder="Ej. Sistema de Gestión de Inventarios" value="API REST Ventas" required>
                </div>

                <div class="campo">
                    <label>Descripción del Proyecto</label>
                    <textarea placeholder="Describe brevemente de qué trata tu proyecto..." rows="5" required>Backend desarrollado en Spring Boot para la gestión integral de ventas y facturación.</textarea>
                </div>

                <div class="campo">
                    <label>Tecnologías Utilizadas</label>
                    <div class="contenedor-checkboxes">
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="html">
                            <span class="custom-check"></span> HTML5
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="css">
                            <span class="custom-check"></span> CSS3
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="js">
                            <span class="custom-check"></span> JavaScript
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="react">
                            <span class="custom-check"></span> React
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="node">
                            <span class="custom-check"></span> Node.js
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="python">
                            <span class="custom-check"></span> Python
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="java" checked>
                            <span class="custom-check"></span> Java
                        </label>
                        <label class="item-check">
                            <input type="checkbox" name="tech" value="sql" checked>
                            <span class="custom-check"></span> SQL
                        </label>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label><i class="fab fa-github"></i> Enlace al Repositorio</label>
                        <input type="url" placeholder="https://github.com/tu-usuario/repo" value="https://github.com/usuario/api-ventas">
                    </div>
                    <div class="campo">
                        <label><i class="fas fa-globe"></i> Enlace a la Demo</label>
                        <input type="url" placeholder="https://tu-proyecto.vercel.app">
                    </div>
                </div>

                <div class="contenedor-botones">
                    <button type="submit" class="btn-guardar">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="includes/footer :: footer"></div>

    <script>
        // --- 1. CARGA DE COMPONENTES E IDENTIDAD ---
        async function cargarInterfaz() {
            try {
                // Cargar Header
                const resHeader = await fetch("localhost:8080/includes/header.html");
                const htmlHeader = await resHeader.text();
                document.getElementById("header-placeholder").innerHTML = htmlHeader;
                actualizarMiUsuarioEnHeader();

                // Cargar Footer
                const resFooter = await fetch("localhost:8080/includes/footer.html");
                const htmlFooter = await resFooter.text();
                document.getElementById("footer-placeholder").innerHTML = htmlFooter;
            } catch (error) {
                console.error("Error al cargar componentes:", error);
            }
        }

        function actualizarMiUsuarioEnHeader() {
            const miNombre = localStorage.getItem('usuarioLogueado');
            const miRol = localStorage.getItem('rolUsuario');
            
            const contenedorHeader = document.getElementById('info-usuario');
            if (miNombre && contenedorHeader) {
                contenedorHeader.innerHTML = `
                    <div style="display: flex; flex-direction: column; text-align: right; justify-content: center;">
                        <span style="color: white; font-weight: bold; font-size: 0.9em; line-height: 1.2;">${miNombre}</span>
                        <span style="color: #FFCC00; font-size: 0.7em; text-transform: uppercase; margin-top: 2px;">${miRol}</span>
                    </div>
                `;
            }
        }

        // --- 2. PREVIEW DE IMAGEN ---
        const fileInput = document.getElementById('file-upload');
        const previewImg = document.getElementById('preview-img');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        // Inicialización
        window.onload = cargarInterfaz;
    </script>

</body>
</html>
