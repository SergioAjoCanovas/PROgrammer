<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Ofertas de Trabajo</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/jobsearching_styles/jobsearching_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* IMPORTANTE: Usamos selectores más específicos para ganarle a otros estilos */
        .activo, 
        header .navegacion-central a.activo i, 
        header .navegacion-central a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="body-layout fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-ofertas">
        
        <div class="tarjeta-oferta" th:each="oferta : ${ofertas}">
            <div class="logo-empresa">
                <img th:src="${oferta.empresa != null && oferta.empresa.fotoPerfil != null ? oferta.empresa.fotoPerfil : '/Img/SILLARUEDASFONDOGRIS.png'}" 
                     alt="Logo Empresa">
            </div>
            
            <div class="info-oferta">
                <h3 class="nombre-empresa" th:text="${oferta.empresa?.username ?: 'Empresa ProGrammer'}">Nombre de la Empresa</h3>
                <h4 class="titulo-puesto" th:text="${oferta.titulo}">Título del Puesto</h4>
                <p class="descripcion-puesto" th:text="${oferta.descripcion}">Descripción de la oferta...</p>
                
                <div class="tech-tags">
                    <span th:each="tech : ${oferta.tecnologias}" th:text="${tech.nombre}">
                        Tecnología
                    </span>
                </div>
            </div>
            
            <div class="acciones-oferta">
                <span class="estado-oferta" th:classappend="${oferta.activa} ? 'activo' : 'inactivo'">
                    <i th:class="${oferta.activa} ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i> 
                    <span th:text="${oferta.activa} ? 'Activa' : 'Cerrada'"></span>
                </span>
                <button class="boton-postular" th:disabled="${!oferta.activa}" onclick="window.location.href='/jobview'">POSTULAR</button>
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(ofertas)}" style="text-align: center; color: white; margin-top: 50px;">
            <h2><i class="fas fa-search"></i> No hay ofertas publicadas en este momento.</h2>
        </div>

    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
    function inicializarHeader() {
        // Buscamos el icono de empleos por su ID
        const navEmpleos = document.getElementById('nav-empleos'); 
        
        if (navEmpleos) {
            navEmpleos.classList.add('activo');
        } else {
            // Si el ID falla, buscamos por el enlace
            const todosLosLinks = document.querySelectorAll('header a');
            todosLosLinks.forEach(link => {
                if (link.getAttribute('href') === '/jobsearching' || link.getAttribute('href')?.includes('jobsearching')) {
                    link.classList.add('activo');
                }
            });
        }
    }

    window.addEventListener('load', () => {
        // Ejecutamos con pequeños retardos para asegurar que el header esté cargado
        setTimeout(inicializarHeader, 50);
        setTimeout(inicializarHeader, 300);
    });
    </script>

</body>
</html>
