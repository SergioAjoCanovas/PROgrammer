<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Ofertas de Trabajo</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/jobsearching_styles/jobsearching_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-layout fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-ofertas">
        
        <div class="cabecera-filtros">
            <div class="filtro-contenedor">
                <button class="btn-filtro filtro-seleccionado" onclick="aplicarFiltro('todas', this)">Todas</button>
                <button class="btn-filtro" onclick="aplicarFiltro('activas', this)">Activas</button>
                <button class="btn-filtro" onclick="aplicarFiltro('cerradas', this)">Cerradas</button>
                <button class="btn-filtro" id="btn-filtro-postulaciones" style="display: none;" onclick="aplicarFiltro('postulaciones', this)">Mis Postulaciones</button>
            </div>

            <div class="acciones-superiores" id="contenedor-ofertas-propias" style="display: none;">
                <button class="boton-ofertas-propias" onclick="irAMisOfertas()">
                    <i class="fas fa-briefcase"></i> Ver mis ofertas publicadas
                </button>
            </div>
        </div>

        <div class="tarjeta-oferta" th:each="oferta : ${ofertas}" th:data-id="${oferta.id}">
            <div class="logo-empresa">
                <img th:src="${oferta.empresa != null && oferta.empresa.fotoPerfil != null ? oferta.empresa.fotoPerfil : '/Img/SILLARUEDASFONDOGRIS.png'}" alt="Logo Empresa">
            </div>
            
            <div class="info-oferta">
                <h3 class="nombre-empresa" th:text="${oferta.empresa?.username ?: 'Empresa ProGrammer'}">Empresa</h3>
                <h4 class="titulo-puesto" th:text="${oferta.titulo}">Título</h4>
                <p class="descripcion-puesto" th:text="${oferta.descripcion}">Descripción</p>
                
                <div class="tech-tags">
                    <span th:each="tech : ${oferta.tecnologias}" th:text="${tech.nombre}">Tech</span>
                </div>
            </div>
            
            <div class="acciones-oferta">
                <span class="estado-oferta" th:classappend="${oferta.activa} ? 'activo' : 'inactivo'">
                    <i th:class="${oferta.activa} ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i> 
                    <span th:text="${oferta.activa} ? 'Activa' : 'Cerrada'"></span>
                </span>
                
                <button class="boton-postular" 
                        th:disabled="${!oferta.activa}" 
                        th:data-activa="${oferta.activa}"
                        th:text="${oferta.activa} ? 'POSTULAR' : 'CERRADA'"
                        th:onclick="'irAJobView(' + ${oferta.id} + ')'">
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(ofertas)}" style="text-align: center; color: white; margin-top: 50px;">
            <h2><i class="fas fa-search"></i> No hay ofertas publicadas.</h2>
        </div>

        <div id="mensaje-filtro-vacio" style="display: none; text-align: center; color: #888; margin-top: 50px;">
            <h2><i class="fas fa-folder-open"></i> No hay resultados para este filtro.</h2>
        </div>

    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
    // Variable global para guardar a qué ofertas se ha postulado el desarrollador
    let misPostulacionesIds = [];

    function irAJobView(ofertaId) {
        const username = localStorage.getItem('usuarioLogueado') || '';
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/jobview/' + ofertaId; 

        const inputUsername = document.createElement('input');
        inputUsername.type = 'hidden';
        inputUsername.name = 'username';
        inputUsername.value = username;

        form.appendChild(inputUsername);
        document.body.appendChild(form);
        form.submit();
    }
    
    function inicializarHeader() {
        const navEmpleos = document.getElementById('nav-empleos'); 
        if (navEmpleos) {
            navEmpleos.classList.add('activo');
        } else {
            const links = document.querySelectorAll('header a');
            links.forEach(link => {
                if (link.getAttribute('href')?.includes('jobsearching')) {
                    link.classList.add('activo');
                }
            });
        }
    }

    // FUNCIÓN MODIFICADA: Ahora gestiona las postulaciones y el cartel de "vacío"
    function aplicarFiltro(tipo, botonSeleccionado) {
        if (botonSeleccionado) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('filtro-seleccionado'));
            botonSeleccionado.classList.add('filtro-seleccionado');
        }
        
        const tarjetas = document.querySelectorAll('.tarjeta-oferta');
        let hayResultados = false;

        tarjetas.forEach(tarjeta => {
            const estadoSpan = tarjeta.querySelector('.estado-oferta');
            const estaActiva = estadoSpan && estadoSpan.classList.contains('activo');
            const ofertaId = parseInt(tarjeta.getAttribute('data-id'));

            let mostrar = false;
            
            if (tipo === 'todas') mostrar = true;
            else if (tipo === 'activas' && estaActiva) mostrar = true;
            else if (tipo === 'cerradas' && !estaActiva) mostrar = true;
            else if (tipo === 'postulaciones' && misPostulacionesIds.includes(ofertaId)) mostrar = true;

            tarjeta.style.display = mostrar ? 'flex' : 'none';
            if (mostrar) hayResultados = true;
        });

        // Mostramos el mensaje si el filtro no deja ninguna oferta en pantalla
        const divVacio = document.getElementById('mensaje-filtro-vacio');
        if (divVacio && tarjetas.length > 0) {
            divVacio.style.display = hayResultados ? 'none' : 'block';
        }
    }

    function comprobarRoles() {
        const rolGuardado = localStorage.getItem('rolUsuario');
        const username = localStorage.getItem('usuarioLogueado');
        const rolString = rolGuardado ? String(rolGuardado).trim().toUpperCase() : 'VISITOR';

        // 1. Lógica para empresas
        const contenedorOfertas = document.getElementById('contenedor-ofertas-propias');
        if ((rolString === 'COMPANY' || rolString === '3') && contenedorOfertas) {
            contenedorOfertas.style.display = 'flex';
        }

        // 2. Lógica para desarrolladores (NUEVO)
        if ((rolString === 'DEVELOPER' || rolString === '2') && username) {
            // Activamos el botón de la pestaña
            document.getElementById('btn-filtro-postulaciones').style.display = 'inline-block';
            
            // Le pedimos al backend los IDs de las ofertas
            fetch('/api/postulaciones/mis-ofertas-ids?username=' + encodeURIComponent(username))
                .then(res => res.json())
                .then(data => {
                    misPostulacionesIds = data;
                })
                .catch(err => console.error("Error al cargar mis postulaciones:", err));
        }
    }

    function irAMisOfertas() {
        const usuario = localStorage.getItem('usuarioLogueado');
        if (usuario) window.location.href = '/mis-ofertas?empresa=' + encodeURIComponent(usuario);
    }

    function adaptarBotonesPorRol() {
        const rolGuardado = localStorage.getItem('rolUsuario');
        const rolString = rolGuardado ? String(rolGuardado).trim().toUpperCase() : 'VISITOR';
        const botones = document.querySelectorAll('.boton-postular');
        
        botones.forEach(boton => {
            const estaActiva = boton.getAttribute('data-activa') === 'true';
            if (estaActiva) {
                if (rolString === 'DEVELOPER' || rolString === '2') {
                    boton.innerHTML = 'POSTULAR';
                } else {
                    boton.innerHTML = 'VER INFORMACIÓN';
                }
            } else {
                boton.innerHTML = '<i class="fas fa-lock"></i> CERRADA';
            }
        });
    }

    window.addEventListener('load', () => {
        inicializarHeader();
        setTimeout(comprobarRoles, 50); // Comprueba Empresas y carga datos de Desarrollador
        setTimeout(adaptarBotonesPorRol, 50); 
    });
    </script>
</body>
</html>
