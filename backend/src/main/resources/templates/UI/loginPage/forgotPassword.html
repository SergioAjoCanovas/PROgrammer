<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/loginPage_styles/loginPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Recuperar Contraseña - PROgrammer</title>

    <style>
        .toast-neon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(15, 5, 5, 0.98);
            color: white;
            padding: 18px 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }

        .toast-error-neon {
            border-left: 6px solid #ff4444;
            box-shadow: 0 8px 32px rgba(255, 68, 68, 0.3);
        }
        
        .toast-success-neon {
            border-left: 6px solid #00ffaa;
            box-shadow: 0 8px 32px rgba(0, 255, 170, 0.3);
        }

        .toast-neon.mostrar {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-error-neon i { color: #ff4444; font-size: 2rem; }
        .toast-success-neon i { color: #00ffaa; font-size: 2rem; }

        .toast-neon strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        .toast-error-neon strong { color: #ff4444; }
        .toast-success-neon strong { color: #00ffaa; }

        .texto-informativo {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="contenedor-login">
        <div class="login-card tarjeta-acordeon">
            <img src="/Img/logo_sin_silla_de_ruedas-removebg-preview.png" alt="Logotimo PROgrammer" class="login-logo"/>
            <h2>Recuperar Contraseña</h2>
            <p class="texto-informativo">Introduce el correo electrónico asociado a tu cuenta y te enviaremos un enlace para restablecer tu contraseña.</p>
            
            <form th:action="@{/forgotPassword}" method="POST" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Introduce tu email" required/>
                </div>

                <button type="submit" class="boton-ver" style="margin-top: 15px;">Enviar Enlace</button>

                <div class="registro-link" style="margin-top: 25px;">
                    <p><a href="/login"><i class="fas fa-arrow-left"></i> Volver a Iniciar sesión</a></p>
                </div>
            </form>
        </div>
    </main>

    
    <div id="toast-error" class="toast-neon toast-error-neon" th:if="${error != null}">
        <i class="fas fa-exclamation-circle"></i>
        <div>
            <strong>Error</strong>
            <span style="font-size: 0.9rem; color: #eee;" th:text="${error}"></span>
        </div>
    </div>

    <div id="toast-success" class="toast-neon toast-success-neon" th:if="${success != null}">
        <i class="fas fa-check-circle"></i>
        <div>
            <strong>Éxito</strong>
            <span style="font-size: 0.9rem; color: #eee;" th:text="${success}"></span>
        </div>
    </div>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toastError = document.getElementById('toast-error');
            const toastSuccess = document.getElementById('toast-success');
            
            if (toastError) {
                setTimeout(() => toastError.classList.add('mostrar'), 100);
                setTimeout(() => toastError.classList.remove('mostrar'), 5000);
            }
            if (toastSuccess) {
                setTimeout(() => toastSuccess.classList.add('mostrar'), 100);
                setTimeout(() => toastSuccess.classList.remove('mostrar'), 5000);
            }
        });
    </script>
</body>
</html>
