<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/loginPage_styles/loginPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Nueva Contraseña - PROgrammer</title>
</head>
<body>
    <main class="contenedor-login">
        <div class="login-card tarjeta-acordeon">
            <img src="/Img/logo_sin_silla_de_ruedas-removebg-preview.png" alt="Logotimo PROgrammer" class="login-logo"/>
            <h2>Nueva Contraseña</h2>
            <p style="color: #ccc; font-size: 0.95rem; text-align: center; margin-bottom: 25px;">Introduce tu nueva contraseña. Debe contener al menos 8 caracteres, una mayúscula, una minúscula y un número.</p>

            <form th:action="@{/resetPassword}" method="POST" class="login-form">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="input-group">
                    <label for="password">Nueva Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Introduce tu nueva contraseña" required >
                        <i class="far fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required >
                    </div>
                    <span id="password-match-error" style="color: #ff4444; font-size: 0.8rem; display: none; margin-top: 5px;">Las contraseñas no coinciden</span>
                </div>

                <button type="submit" id="btn-submit" class="boton-ver" style="margin-top: 15px;">Guardar Contraseña</button>
            </form>
        </div>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const confirmPasswordInput = document.querySelector('#confirmPassword');
        const form = document.querySelector('.login-form');
        const errorSpan = document.getElementById('password-match-error');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });

        form.addEventListener('submit', function(e) {
            if (passwordInput.value !== confirmPasswordInput.value) {
                e.preventDefault();
                errorSpan.style.display = 'block';
            } else {
                errorSpan.style.display = 'none';
            }
        });
    </script>
</body>
</html>
