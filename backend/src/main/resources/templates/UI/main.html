<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Conecta</title>
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/homePage_styles/selector.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .activo, .activo i, .activo span {
            color: #FFCC00 !important;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('user')) {
            localStorage.setItem('usuarioLogueado', params.get('user'));
            localStorage.setItem('rolUsuario', params.get('rol'));
            // Limpiamos la URL para que no se vean los parámetros
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>

    <div th:replace="includes/header :: header"></div>

    <main class="contenedor-selector">
        <section class="contenido-central">
            <h1 class="titulo-selector">CONECTA CON:</h1>
            <div class="contenedor-botones-gigantes">
                <a href="/serachCompanies" class="btn-seleccion-neon">
                    <i class="fas fa-building"></i>
                    <span>EMPRESAS</span>
                </a>
                <a href="/searchProgrammer" class="btn-seleccion-neon">
                    <i class="fas fa-code"></i>
                    <span>PROGRAMADORES</span>
                </a>
            </div>
        </section>
    </main>

    <div th:replace="includes/footer :: footer"></div>

    <script>
        function cargarComponentes() {
            const headerPath = "localhost:8080/includes/header.html";
            const footerPath = "localhost:8080/includes/footer.html";

            // Cargar Header
            fetch(headerPath)
                .then(res => res.text())
                .then(html => {
                    document.getElementById("header-placeholder").innerHTML = html;
                    marcarLinkActivo(); 
                    // ¡OJO! Llamamos a mostrar usuario justo después de cargar el header
                    mostrarInfoUsuario(); 
                });

            fetch(footerPath)
                .then(res => res.text())
                .then(html => {
                    document.getElementById("footer-placeholder").innerHTML = html;
                });
        }

        function mostrarInfoUsuario() {
            const username = localStorage.getItem('usuarioLogueado');
            const rol = localStorage.getItem('rolUsuario');
            const contenedor = document.getElementById('info-usuario');

            if (username && contenedor) {
                contenedor.innerHTML = `
                    <div style="display: flex; flex-direction: column; text-align: right;  justify-content: center;">
                        <span style="color: white; font-weight: bold; font-size: 0.9em; line-height: 1;">${username}</span>
                        <span style="color: #FFCC00; font-size: 0.7em; text-transform: uppercase; margin-top: 2px;">${rol}</span>
                    </div>
                `;
            }
        }

        function marcarLinkActivo() {
            const currentPath = window.location.pathname;
            const enlaces = document.querySelectorAll('#header-placeholder a');
            enlaces.forEach(enlace => {
                const href = enlace.getAttribute('href');
                if (href && currentPath.includes(href)) {
                    enlace.classList.add('activo');
                }
            });
        }

        window.onload = cargarComponentes;
    </script>
</body>
</html>
