<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Conecta</title>
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/homePage_styles/selector.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .activo, .activo i, .activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <script>
        // 1. CAPTURAR DATOS DE LA URL NADA MÁS ARRANCAR LA PÁGINA
        const params = new URLSearchParams(window.location.search);
        if (params.has('user')) {
            localStorage.setItem('usuarioLogueado', params.get('user'));
            // Guardamos el rol (si no hay, por defecto ponemos 2 que es Developer)
            localStorage.setItem('rolUsuario', params.get('rol') || '2'); 
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-selector">
        <section class="contenido-central">
            <h1 class="titulo-selector">CONECTA CON:</h1>
            <div class="contenedor-botones-gigantes">
                <a href="/serachCompanies" class="btn-seleccion-neon">
                    <i class="fas fa-building"></i>
                    <span>EMPRESAS</span>
                </a>
                <a href="/searchProgrammer" class="btn-seleccion-neon">
                    <i class="fas fa-code"></i>
                    <span>PROGRAMADORES</span>
                </a>
            </div>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        function inicializarPagina() {
            const username = localStorage.getItem('usuarioLogueado');
            let rol = localStorage.getItem('rolUsuario');
            
            // --- 1. PINTAR LA INFO DEL USUARIO EN EL HEADER ---
            const contenedor = document.getElementById('info-usuario');
            if (username && contenedor) {
                let nombreRol = rol;
                // Traducimos los IDs de tu base de datos a texto para que se vea bonito
                if (rol == '1') nombreRol = 'ADMIN';
                if (rol == '2') nombreRol = 'DEVELOPER';
                if (rol == '3') nombreRol = 'COMPANY';

                contenedor.innerHTML = `
                    <div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;">
                        <span style="color: white; font-weight: bold; font-size: 0.85em;">${username.toUpperCase()}</span>
                        <span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${nombreRol}</span>
                    </div>
                `;
            }

            // --- 2. LA MAGIA: ENCENDER EL BOTÓN DE PUBLICAR SI ES EMPRESA ---
            const btnPublicar = document.getElementById('nav-publicar-oferta');
            if (btnPublicar && rol) {
                const rolComprobacion = String(rol).trim().toUpperCase();
                // Si el rol guardado es "COMPANY" o el ID "3" de tu tabla -> Lo mostramos
                if (rolComprobacion === 'COMPANY' || rolComprobacion === '3') {
                    btnPublicar.style.display = 'flex'; 
                }
            }

            // --- 3. MARCAR ICONO ACTIVO ---
            const navInicio = document.getElementById('nav-inicio');
            if (navInicio) navInicio.classList.add('activo');
        }

        // Ejecutamos cuando todo el HTML (incluido el header de Thymeleaf) esté cargado
        window.addEventListener('load', () => {
            setTimeout(inicializarPagina, 50); 
        });
    </script>
</body>
</html>
