<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Reseña de Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/newprojectreview/newprojectreview.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">  
    <link rel="stylesheet" href="/Style/profileView_styles/profileView.css">
    <link rel="stylesheet" href="/Style/projectview_styles/projectview.css">
    <link rel="stylesheet" href="/Style/projectview_styles/images.css">
    <link rel="stylesheet" href="/Style/projectview_styles/images-modals.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-principal">

    <aside class="columna-perfil">
        <div class="tarjeta-perfil">
            <div class="cabecera-tarjeta">
                <div class="foto-perfil-contenedor">
                    <div class="circulo-foto"></div>
                    <div class="icono-corazon"><i class="fas fa-heart"></i></div>
                </div>
                <h2 class="nombre-usuario" id="nombre-mi-perfil">Cargando...</h2>
            </div>

            <div class="perfil-inferior">
                <ul class="redes-sociales">
                    <li><i class="fab fa-instagram"></i> Instagram</li>
                    <li><i class="fab fa-twitter"></i> Twitter</li>
                    <li><i class="fas fa-phone-alt"></i> Teléfono</li>
                </ul>
                <button class="boton-curriculum">CURRICULUM</button>
            </div>
        </div>
    </aside>

    <section class="seccion-derecha-dinamica">
        <div class="tarjeta-proyecto-detalle">
            <div class="cabecera-proyecto">
                <h2>Nombre del Proyecto</h2>
                <a href="/projectview" class="boton-volver-curvo">
                    <i class="fas fa-undo"></i>
                </a>
            </div>

            <div class="info-superior">
                <p><strong>Autor:</strong> David Alcázar</p>
                <div class="estado-proyecto">
                    <span class="badge validado"><i class="fas fa-check-circle"></i> Validado</span>
                    <button class="boton-descargar"><i class="fas fa-download"></i> Descargar</button>
                </div>
            </div>

            <div class="galeria-proyecto">
                <img src="/Img/stock/ejemplo1.jpg" class="img-proyecto" alt="Captura 1">
                <img src="/Img/stock/ejemplo2.jpg" class="img-proyecto" alt="Captura 2">
                <img src="/Img/stock/ejemplo3.jpg" class="img-proyecto" alt="Captura 3">
                <img src="/Img/stock/ejemplo4.jpg" class="img-proyecto" alt="Captura 4">
            </div>

            <div class="descripcion-proyecto">
                <h3>Descripción</h3>
                <p>Este proyecto consiste en una plataforma para conectar desarrolladores...</p>
            </div>

            <div class="repo">
                <h3>Repositorio</h3>
                <a href="#" target="_blank"><i class="fab fa-github"></i> https://github.com/proyecto</a>
            </div>
        </div>
    </section>

    <aside class="zona-derecha">
        <div class="tarjeta-formulario">
            <h2><i class="fas fa-star"></i> Valorar proyecto</h2>
    
            <form action="/project-reviews/crear" method="post">

                <!-- HARDCODE TEMPORAL -->
                <input type="hidden" name="proyectoId" value="1">
            
                <div class="campo">
                    <label>Arquitectura</label>
                    <div class="estrellas" data-tipo="arquitectura"></div>
                    <input type="hidden" name="arquitectura" id="input-arquitectura">
                </div>
            
                <div class="campo">
                    <label>Limpieza de código</label>
                    <div class="estrellas" data-tipo="limpieza"></div>
                    <input type="hidden" name="limpieza" id="input-limpieza">
                </div>
            
                <div class="campo">
                    <label>Documentación</label>
                    <div class="estrellas" data-tipo="documentacion"></div>
                    <input type="hidden" name="documentacion" id="input-documentacion">
                </div>
            
                <div class="campo">
                    <label>Comentario</label>
                    <textarea name="comentario" placeholder="Escribe tu reseña..." required></textarea>
                </div>
            
                <button type="submit" class="boton-ver">
                    <i class="fas fa-paper-plane"></i> Publicar reseña
                </button>
            </form>
        </div>
    </aside>

</main>

<div id="miModal" class="modal">
    <img class="contenido-modal" id="imagenFull">
    <div id="caption-modal"></div>
</div>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        inicializarIdentidadYEventos();
    });

    function inicializarIdentidadYEventos() {
        const username = localStorage.getItem('usuarioLogueado');
        const rol = localStorage.getItem('rolUsuario') || 'USER';
        
        // 1. Inyectar en el Header
        const contenedorHeader = document.getElementById('info-usuario');
        if (username && contenedorHeader) {
            contenedorHeader.innerHTML = `
                <div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;">
                    <span style="color: white; font-weight: bold; font-size: 0.85em;">${username.toUpperCase()}</span>
                    <span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${rol.toUpperCase()}</span>
                </div>
            `;
        }

        // 2. Inyectar en la tarjeta lateral (porque eres TÚ quien escribe la reseña)
        const nombreLateral = document.getElementById('nombre-mi-perfil');
        if (username && nombreLateral) {
            nombreLateral.innerText = username;
        }

        // 3. Lógica de Estrellas
        document.querySelectorAll(".estrellas").forEach(container => {
            const tipo = container.dataset.tipo;
            const input = document.getElementById("input-" + tipo);

            for (let i = 1; i <= 5; i++) {
                const estrella = document.createElement("i");
                estrella.classList.add("far", "fa-star");
                container.appendChild(estrella);

                estrella.addEventListener("click", function() {
                    input.value = i;
                    const estrellas = container.querySelectorAll("i");
                    estrellas.forEach((s, index) => {
                        s.classList.toggle("fas", index < i);
                        s.classList.toggle("far", index >= i);
                        s.classList.toggle("activa", index < i);
                    });
                });
            }
        });
    }

    // Lógica del Modal de imágenes
    const modal = document.getElementById("miModal");
    const modalImg = document.getElementById("imagenFull");
    const captionText = document.getElementById("caption-modal");

    document.querySelectorAll(".img-proyecto").forEach(img => {
        img.onclick = function() {
            modal.style.display = "block";
            modalImg.src = this.src;
            captionText.innerHTML = this.alt;
            document.body.style.overflow = "hidden"; 
        }
    });

    window.onclick = function(event) {
        if (event.target == modal) { 
            modal.style.display = "none"; 
            document.body.style.overflow = "auto"; 
        }
    }
</script>
</body>
</html>
