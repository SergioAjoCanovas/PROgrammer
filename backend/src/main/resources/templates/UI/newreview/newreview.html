<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Reseñas</title>

    <link rel="stylesheet" href="../../../static/Style/general_styles/header.css">
    <link rel="stylesheet" href="../../../static/Style/general_styles/footer.css">
    <link rel="stylesheet" href="../../../static/Style/newreview_styles/newreview.css">
    <link rel="stylesheet" href="../../../static/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="../../../static/Style/profileView_styles/profileView.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon">

<div id="header-placeholder"></div>

<main class="contenedor-principal">

    <!-- =========================
         PERFIL USUARIO
    ========================== -->
    <aside class="columna-perfil">

        <div class="tarjeta-perfil">

            <div class="perfil-superior">
                <div class="foto-perfil-contenedor">
                    <div class="circulo-foto"></div>
                    <div class="icono-corazon">
                        <i class="fas fa-heart"></i>
                    </div>
                </div>

                <h2 class="nombre-usuario"
                    th:text="${usuario.username}">
                    Usuario
                </h2>
            </div>

            <div class="perfil-inferior">
                <ul class="redes-sociales">
                    <li><i class="fab fa-instagram"></i> Insta</li>
                    <li><i class="fab fa-twitter"></i> Twitter</li>
                    <li><i class="fas fa-phone"></i> Tel</li>
                </ul>

                <button class="boton-curriculum">
                    CURRICULUM
                </button>
            </div>

        </div>
    </aside>

    <!-- =========================
         REVIEWS
    ========================== -->
    <section class="zona-reseñas">

        <!-- =========================
             FORMULARIO
        ========================== -->
        <div class="tarjeta-acordeon tarjeta-crear-reseña">

            <h2><i class="fas fa-pen"></i> Añadir reseña</h2>

            <a th:href="@{/reviews/{id}(id=${usuario.id})}" class="boton-volver-circular">
                <i class="fas fa-undo"></i>
            </a>

            <form th:action="@{/reviews/crear}" method="post">

                <input type="hidden" name="receptorId" th:value="${usuario.id}">
                <input type="hidden" name="rating" id="rating">

                <!-- ESTRELLAS -->
                <div class="campo">
                    <label>Valoración</label>

                    <div class="estrellas" id="estrellas">
                        <i class="far fa-star" data-value="1"></i>
                        <i class="far fa-star" data-value="2"></i>
                        <i class="far fa-star" data-value="3"></i>
                        <i class="far fa-star" data-value="4"></i>
                        <i class="far fa-star" data-value="5"></i>
                    </div>
                </div>

                <!-- COMENTARIO -->
                <div class="campo">
                    <label>Comentario</label>
                    <textarea name="comentario" placeholder="Escribe tu reseña..."></textarea>
                </div>

                <button type="submit" class="boton-ver">
                    <i class="fas fa-paper-plane"></i> Publicar reseña
                </button>

            </form>

        </div>

        <!-- =========================
             LISTA REVIEWS
        ========================== -->
        <div class="tarjeta-acordeon tarjeta-lista-reseñas">

            <h2><i class="fas fa-comments"></i> Reseñas</h2>

            <!-- MEDIA -->
            <div class="media-global">
                <h3>Media global</h3>

                <div class="media-estrellas">
                    <i class="fas fa-star" th:each="i : ${#numbers.sequence(1,5)}"
                       th:classappend="${i <= media} ? ' activa' : ''"></i>

                    <span th:text="${#numbers.formatDecimal(media,1,1)}"></span>
                </div>
            </div>

            <!-- REVIEWS -->
            <div class="contenedor-reseñas">

                <div class="reseña" th:each="r : ${reviews}">

                    <div class="reseña-header">
                        <span class="usuario" th:text="${r.autor.username}"></span>

                        <span class="rating"
                              th:text="${#strings.repeat('⭐', r.rating)}"></span>
                    </div>

                    <p th:text="${r.comentario}"></p>

                </div>

            </div>

        </div>

    </section>

</main>

<div id="footer-placeholder"></div>

<!-- =========================
     ESTRELLAS JS (SOLO UI)
========================= -->
<script>
let ratingSeleccionado = 0;

const estrellas = document.querySelectorAll("#estrellas i");
const inputRating = document.getElementById("rating");

estrellas.forEach(e => {
    e.addEventListener("click", () => {

        ratingSeleccionado = e.dataset.value;
        inputRating.value = ratingSeleccionado;

        estrellas.forEach(s => {
            s.classList.remove("fas", "activa");
            s.classList.add("far");
        });

        for (let i = 0; i < ratingSeleccionado; i++) {
            estrellas[i].classList.add("fas", "activa");
            estrellas[i].classList.remove("far");
        }
    });
});
</script>

<!-- HEADER / FOOTER -->
<script>
fetch("/includes/header.html")
    .then(r => r.text())
    .then(html => document.getElementById("header-placeholder").innerHTML = html);

fetch("/includes/footer.html")
    .then(r => r.text())
    .then(html => document.getElementById("footer-placeholder").innerHTML = html);
</script>

</body>
</html>
