<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ProGrammer - Perfil limitado</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">

    <link rel="stylesheet" href="/Style/ownProfile_styles/ownProfileLimitado.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon">

<div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-limitado">

    <div class="tarjeta-limitada tarjeta-edicion-rapida">

        <div class="perfil-superior">
    
            <!-- FOTO PERFIL -->
            <form id="formFotoLimited"
                  action="/usuario/uploadFoto"
                  method="post"
                  enctype="multipart/form-data">
    
                <label for="fotoLimited" style="cursor:pointer;">
                    <div class="circulo-foto">
                        <img th:if="${usuarioLogueado.fotoPerfil != null}"
                             th:src="${usuarioLogueado.fotoPerfil}"
                             style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
    
                        <i th:if="${usuarioLogueado.fotoPerfil == null}"
                           class="fas fa-user"
                           style="font-size:2rem; color:#FFCC00;"></i>
                    </div>
                </label>
    
                <input type="file"
                       id="fotoLimited"
                       name="foto"
                       accept="image/*"
                       style="display:none;"
                       onchange="document.getElementById('formFotoLimited').submit();">
            </form>
    
            <!-- USERNAME -->
            <div class="contenedor-nombre-usuario">
    
                <span class="nombre-usuario"
                      th:text="${usuarioLogueado.username}"
                      id="usernameLimited"></span>
    
                <i class="fas fa-pen icono-editar-nombre"
                   onclick="activarEditUsernameLimited()"></i>
            </div>
    
            <form id="formUsernameLimited"
                  action="/usuario/updateUsername"
                  method="post"
                  style="display:none; width:100%;">
    
                <input type="text"
                       name="username"
                       class="input-nombre-perfil"
                       id="inputUsernameLimited"
                       th:value="${usuarioLogueado.username}">
    
                <button type="submit" class="boton-amarillo-solido">
                    Guardar
                </button>
            </form>
    
        </div>
    </div>

    <div class="tarjeta-limitada">

        <div class="icono-lock">
            <i class="fas fa-lock"></i>
        </div>

        <h2>PERFIL LIMITADO</h2>

        <p>Esta cuenta tiene acceso limitado.</p>

        <p class="mensaje-secundario">
            Si deseas ser desarrollador o empresa, ponte en contacto con un administrador.
        </p>

        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=programmer.soporte@gmail.com&su=Soporte%20ProGrammer&body=Hola%20equipo%20de%20ProGrammer," 
           target="_blank" 
           class="btn-contacto">
            <i class="fas fa-envelope"></i> Contactar con administrador
        </a>

    </div>

</main>

<style>
    .item-derecha.activo .avatar-usuario {
        box-shadow: 0 0 20px #FFCC00 !important;
        transform: scale(1.1) !important;
        border-color: #FFCC00 !important;
    }

    .item-derecha.activo .avatar-usuario i {
        color: #FFCC00 !important;
        text-shadow: 0 0 10px #FFCC00 !important;
    }

    .item-derecha.activo .texto-icono {
        color: #FFCC00 !important;
        text-shadow: 0 0 10px #FFCC00, 
                     0 0 20px #FFCC00, 
                     0 0 40px rgba(255, 204, 0, 0.6) !important;
        transform: scale(1.15) !important;
    }
</style>

<div th:replace="~{includes/footer :: footer}"></div>

<script>
window.addEventListener('load', () => {
    const btnPerfil = document.getElementById('link-perfil');
    if (btnPerfil) btnPerfil.classList.add('activo');
});

/* ================================
   EDIT USERNAME (FIX AJAX)
================================ */
document.getElementById("formUsernameLimited").addEventListener("submit", async function (e) {
    e.preventDefault();

    const form = e.target;
    const data = new URLSearchParams(new FormData(form));

    const res = await fetch(form.action, {
        method: "POST",
        body: data
    });

    const text = await res.text();

    if (text === "OK") {
        location.reload(); // refresca nombre/foto actualizados
    } else {
        alert(text); // EXISTS, EMPTY, etc.
    }
});

function activarEditUsernameLimited() {
    document.getElementById('usernameLimited').style.display = 'none';
    document.getElementById('formUsernameLimited').style.display = 'block';
    document.getElementById('inputUsernameLimited').focus();
}
</script>

</body>
</html>
