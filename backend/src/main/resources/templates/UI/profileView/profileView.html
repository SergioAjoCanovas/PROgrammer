<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Perfil de <span th:text="${usuario.username}">Usuario</span></title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/profileView_styles/profileView.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .activo, 
        header .nav-enlaces a.activo i, 
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
        }
        .circulo-foto img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0; z-index: 1;
        }
        .icono-corazon { z-index: 2; position: absolute; }
        .estrellas i { cursor: pointer; color: #555; transition: 0.3s; }
        .estrellas i.activa { color: #FFCC00; text-shadow: 0 0 5px #FFCC00; }
        
        .resena-item {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .resena-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .resena-usuario { font-weight: bold; color: #00f3ff; font-size: 0.9rem; }
        .resena-rating { color: #FFCC00; }
        .resena-texto { font-size: 0.85rem; color: #ccc; }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal">
        <aside class="columna-perfil">
            <div class="tarjeta-perfil">
                <div class="perfil-superior">
                    <div class="foto-perfil-contenedor">
                        <div class="circulo-foto">
                            <img th:src="${usuario.fotoPerfil != null ? usuario.fotoPerfil : '/Img/stock/default-profile.png'}" alt="Foto de Perfil">
                        </div>
                        <div class="icono-corazon"><i class="fas fa-heart"></i></div>
                    </div>
                    <h2 class="nombre-usuario" th:text="${usuario.username}">Nombre</h2>
                    <p style="color: #FFCC00; font-weight: bold;">Media: <span th:text="${media}">0</span> ⭐</p>
                </div>

                <div class="perfil-inferior">
                    <ul class="redes-sociales">
                        <li th:if="${usuario.github != null and !usuario.github.isEmpty()}">
                            <i class="fab fa-github"></i> <a th:href="${usuario.github}" target="_blank" style="color: white; text-decoration: none;">GitHub</a>
                        </li>
                        <li th:if="${usuario.linkedin != null and !usuario.linkedin.isEmpty()}">
                            <i class="fab fa-linkedin"></i> <a th:href="${usuario.linkedin}" target="_blank" style="color: white; text-decoration: none;">LinkedIn</a>
                        </li>
                    </ul>
                    <a th:if="${usuario.curriculum != null and !usuario.curriculum.isEmpty()}" th:href="${usuario.curriculum}" target="_blank" style="text-decoration: none;">
                        <button class="boton-curriculum">CURRICULUM</button>
                    </a>
                </div>
            </div>
            
            <div class="tarjeta-resenas-izq" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.id != usuario.id}">
                <h3>AÑADIR RESEÑA</h3>
                
                <form th:action="@{/reviews/crear}" method="post" th:object="${newReview}">
                    <input type="hidden" name="receptorId" th:value="${usuario.id}">
                    
                    <div class="campo">
                        <label style="color: #FFCC00; font-size: 0.8rem; text-transform: uppercase; font-weight: bold;">Tu valoración</label>
                        <div class="estrellas" id="estrellas-selector">
                            <i class="far fa-star" data-value="1"></i>
                            <i class="far fa-star" data-value="2"></i>
                            <i class="far fa-star" data-value="3"></i>
                            <i class="far fa-star" data-value="4"></i>
                            <i class="far fa-star" data-value="5"></i>
                        </div>
                        <input type="hidden" th:field="*{rating}" id="rating-value" value="0">
                    </div>

                    <textarea class="input-resena" th:field="*{comentario}" placeholder="Cuéntanos tu experiencia..." required></textarea>
                    
                    <button type="submit" class="boton-anadir">
                        <i class="fas fa-paper-plane"></i> Publicar reseña
                    </button>
                </form>
                
                <p th:if="${param.error == 'duplicated'}" style="color: #ff4444; font-size: 0.8rem; margin-top: 5px;">Ya has valorado a este usuario.</p>
                <p th:if="${param.error == 'autoreview'}" style="color: #ff4444; font-size: 0.8rem; margin-top: 5px;">No puedes valorarte a ti mismo.</p>
            </div>
        </aside>

        <div class="columna-derecha">
            <section class="seccion-proyectos">
                <div class="tarjeta-proyectos-contenedor">
                    <div class="cabecera-proyectos">
                        <h2>PROYECTOS</h2>
                    </div>
                    <div class="rejilla-proyectos">
                        <div class="tarjeta-mini-proyecto">
                            <h3>Próximamente</h3>
                            <p>Proyectos del usuario.</p>
                        </div>
                    </div>
                </div>
            </section>

            <div class="contenedor-inferior-derecha">
                <div class="tarjeta-inferior">
                    <div class="cabecera-inferior"><h3>RESEÑAS RECIENTES</h3></div>
                    <div class="contenido-inferior">
                        <div th:if="${#lists.isEmpty(reviews)}">
                            <p>No hay reseñas aún.</p>
                        </div>
                        <div th:each="r : ${reviews}" class="resena-item">
                            <div class="resena-header">
                                <span class="resena-usuario" th:text="${r.autor.username}">Usuario</span>
                                <span class="resena-rating">
                                    <span th:each="i : ${#numbers.sequence(1, r.rating)}">⭐</span>
                                </span>
                            </div>
                            <p class="resena-texto" th:text="${r.comentario}">Comentario...</p>
                        </div>
                    </div>
                </div>

                <div class="tarjeta-inferior">
                    <div class="cabecera-inferior"><h3>SOBRE MI</h3></div>
                    <div class="contenido-inferior">
                        <p th:text="${usuario.biografia != null and !usuario.biografia.isEmpty() ? usuario.biografia : 'Sin descripción.'}"></p>
                        
                        <div th:if="${perfilDesarrollador != null and !perfilDesarrollador.tecnologias.isEmpty()}" style="margin-top: 15px;">
                            <h4 style="color: #FFCC00; font-size: 0.9rem; margin-bottom: 10px;">Tecnologías:</h4>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <span th:each="tech : ${perfilDesarrollador.tecnologias}" th:text="${tech.nombre}" 
                                      style="background: rgba(0,243,255,0.1); padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(0,243,255,0.3); color: white; font-size: 0.8rem;">
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const estrellas = document.querySelectorAll("#estrellas-selector i");
            const inputRating = document.getElementById("rating-value");

            estrellas.forEach(star => {
                star.addEventListener("click", () => {
                    const val = star.dataset.value;
                    inputRating.value = val;

                    estrellas.forEach((s, index) => {
                        if (index < val) {
                            s.classList.replace("far", "fas");
                            s.classList.add("activa");
                        } else {
                            s.classList.replace("fas", "far");
                            s.classList.remove("activa");
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
