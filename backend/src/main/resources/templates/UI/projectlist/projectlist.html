<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Proyectos</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/projectlist_styles/proyectlist.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        /* Brillo neón para la sección activa (Perfil) */
        .activo, 
        header .nav-enlaces a.activo i, 
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal">
        <aside class="columna-perfil">
            <div class="tarjeta-perfil">
                <div class="perfil-superior">
                    <div class="foto-perfil-contenedor">
                        <div class="circulo-foto"></div>
                        <div class="icono-corazon"><i class="fas fa-heart"></i></div>
                    </div>
                    <h2 class="nombre-usuario">Nombre del usuario</h2>
                </div>

                <div class="perfil-inferior">
                    <ul class="redes-sociales">
                        <li><i class="fab fa-instagram"></i> Instagram</li>
                        <li><i class="fab fa-twitter"></i> Twitter</li>
                        <li><i class="fas fa-phone"></i> Teléfono</li>
                    </ul>
                    <button class="boton-curriculum">CURRICULUM</button>
                </div>
            </div>
            
            <div class="tarjeta-resenas-izq">
                <h3>RESEÑAS</h3>
                <textarea class="input-resena" placeholder="Escribe aquí..."></textarea>
                <button class="boton-anadir" onclick="window.location.href='/newreview'">Añadir reseña</button>
            </div>
        </aside>

        <section class="seccion-derecha-dinamica">
            <div class="tarjeta-acordeon-contenedor">
                <div class="cabecera-acordeon">
                    <h2>PROYECTOS</h2>
                    <a href="/profileView" class="boton-volver-circular" title="Volver">
                        <i class="fas fa-undo"></i>
                    </a>
                </div>

                <div id="acordeon-proyectos">
                    <h3 class="acordeon-titulo">Proyecto 1</h3>
                    <div class="contenido-desplegable">
                        <div class="inner-content">
                            <p>Descripción del proyecto 1 detallada aquí.</p>
                            <button class="boton-ver-proyecto" onclick="window.location.href='/projectview'">
                                VER PROYECTO
                            </button>
                        </div>
                    </div>

                    <h3 class="acordeon-titulo">Proyecto 2</h3>
                    <div class="contenido-desplegable">
                        <div class="inner-content">
                            <p>Descripción del proyecto 2 detallada aquí.</p>
                            <button class="boton-ver-proyecto">VER PROYECTO</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <script>
        $(function() {
            // Inicialización del Acordeón
            $("#acordeon-proyectos").accordion({
                collapsible: true,
                heightStyle: "content",
                active: 0,
                animate: 400 
            });

            // Lógica de identidad y navegación
            inicializarHeaderProyectos();
        });

        function inicializarHeaderProyectos() {
            const miNombre = localStorage.getItem('usuarioLogueado');
            const miRol = localStorage.getItem('rolUsuario') || 'USER';
            const contenedorHeader = document.getElementById('info-usuario');
            const navPerfil = document.getElementById('nav-perfil');

            // 1. Inyectar TUS datos en el Header
            if (miNombre && contenedorHeader) {
                contenedorHeader.innerHTML = `
                    <div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;">
                        <span style="color: white; font-weight: bold; font-size: 0.85em;">${miNombre.toUpperCase()}</span>
                        <span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${miRol.toUpperCase()}</span>
                    </div>
                `;
            }

            // 2. Iluminar icono de Perfil (ya que estamos en una subsección de perfil)
            if (navPerfil) {
                navPerfil.classList.add('activo');
            } else {
                // Fallback si no hay ID
                const links = document.querySelectorAll('header a');
                links.forEach(l => {
                    if (l.getAttribute('href')?.includes('profileView') || l.getAttribute('href')?.includes('projectlist')) {
                        l.classList.add('activo');
                    }
                });
            }
        }
    </script>
</body>
</html>
