<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Proyectos</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/projectlist_styles/proyectlist.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        .activo,
        header .nav-enlaces a.activo i,
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
        }

        * { box-sizing: border-box; }
        body { overflow-x: hidden; }

        #acordeon-proyectos {
            width: 100%;
            max-width: 100%;
        }

        .ui-accordion .ui-accordion-header {
            font-size: 1rem !important;
            padding: 14px 18px !important;
            width: 100%;
            border-radius: 10px !important;
        }

        .ui-accordion-content {
            overflow-x: hidden !important;
            max-width: 100%;
        }

        .inner-content {
            max-width: 100%;
            word-wrap: break-word;
        }

        .botones-proyecto {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .botones-proyecto button {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* FIX FOTO */
        .circulo-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>

<body class="fondo-oscuro-neon">

<div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-principal">

    <!-- SIDEBAR (MISMAS CLASES QUE EL ORIGINAL) -->
    <aside class="columna-perfil">

        <div class="tarjeta-perfil">

            <div class="perfil-superior">
                <div class="foto-perfil-contenedor">

                    <div class="circulo-foto">
                        <img th:if="${usuario.fotoPerfil != null}" 
                             th:src="${usuario.fotoPerfil}" 
                             alt="foto perfil">

                        <i th:if="${usuario.fotoPerfil == null}" 
                           class="fas fa-user"></i>
                    </div>

                </div>

                <h2 class="nombre-usuario"
                    th:text="${usuario.username}">
                </h2>

                <div th:if="${media > 0}" 
                     style="margin-top: 10px; color: #FFCC00; font-size: 0.9rem; font-weight: bold;">
                    Valoración: <span th:text="${media}"></span> ⭐
                </div>
            </div>

            <div class="perfil-inferior">

                <!-- REDES + CV (DOTTED UNIFICADO) -->
            <div class="lista-dotted">

                <a th:if="${usuario.github != null}"
                th:href="${usuario.github}"
                target="_blank"
                class="item-dotted">

                    <i class="fab fa-github"></i>
                    <span>Mi GitHub</span>
                </a>

                <a th:if="${usuario.linkedin != null}"
                th:href="${usuario.linkedin}"
                target="_blank"
                class="item-dotted">

                    <i class="fab fa-linkedin"></i>
                    <span>Mi LinkedIn</span>
                </a>

                <a th:if="${cvUrl != null}"
                th:href="${cvUrl}"
                target="_blank"
                class="item-dotted">

                    <i class="fas fa-file-alt"></i>
                    <span th:text="${cvNombre}">Mi CV</span>
                </a>

            </div>

            </div>

        </div>

    </aside>

    <!-- CONTENIDO -->
    <section class="seccion-derecha-dinamica">

        <div class="tarjeta-acordeon-contenedor">

            <div class="cabecera-acordeon">
                <h2>PROYECTOS</h2>
                <a href="/ownProfile" class="boton-volver-circular">
                    <i class="fas fa-undo"></i>
                </a>
            </div>

            <div id="acordeon-proyectos">

                <th:block th:each="p : ${proyectos}">

                    <h3 th:text="${p.titulo}"></h3>

                    <div>
                        <div class="inner-content">

                            <p th:text="${p.descripcion}"></p>

                            <div class="botones-proyecto">

                                <button class="boton-ver-proyecto"
                                        th:onclick="'window.location.href=\'/proyectos/proyecto/' + ${p.id} + '\';'">
                                    VER PROYECTO
                                </button>

                                <button class="boton-eliminar-proyecto"
                                        th:attr="data-id=${p.id}"
                                        onclick="abrirModalEliminarLista(this)">
                                    BORRAR PROYECTO
                                </button>

                            </div>

                        </div>
                    </div>

                </th:block>

            </div>

        </div>

    </section>

</main>

<!-- MODAL -->
<div id="modal-eliminar" class="modal">
    <div class="contenido-modal-confirmacion">

        <p>¿Estás seguro de que quieres eliminar este proyecto?</p>

        <div class="botones-confirmacion">
            <button class="btn-eliminar" onclick="eliminarProyecto()">
                Sí, eliminar
            </button>

            <button onclick="cerrarModalEliminar()">
                Cancelar
            </button>
        </div>

    </div>
</div>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<script>
let proyectoIdEliminar = null;

$(function () {
    const $acc = $("#acordeon-proyectos");

    if ($acc.hasClass("ui-accordion")) {
        $acc.accordion("destroy");
    }

    $acc.accordion({
        collapsible: true,
        heightStyle: "content",
        active: false,
        animate: 200
    });

    inicializarHeaderProyectos();
});

function inicializarHeaderProyectos() {
    document.querySelectorAll('header a').forEach(l => {
        if (l.href.includes('projectlist')) {
            l.classList.add('activo');
        }
    });
}

$(document).on("click", ".boton-ver-proyecto, .boton-eliminar-proyecto", function (e) {
    e.stopPropagation();
});

function abrirModalEliminarLista(btn) {
    proyectoIdEliminar = btn.getAttribute("data-id");
    $("#modal-eliminar").css("display", "flex").hide().fadeIn(200);
    document.body.style.overflow = "hidden";
}

function cerrarModalEliminar() {
    $("#modal-eliminar").fadeOut(200);
    document.body.style.overflow = "auto";
}

function eliminarProyecto() {
    if (!proyectoIdEliminar) return;

    fetch("/proyectos/delete/" + proyectoIdEliminar, {
        method: "POST"
    })
    .then(res => res.text())
    .then(data => {
        if (data === "OK") {
            window.location.href = "/proyectos/projectList";
        }
    });
}
</script>

</body>
</html>
