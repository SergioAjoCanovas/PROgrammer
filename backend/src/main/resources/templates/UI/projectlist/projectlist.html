<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Proyectos</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/projectlist_styles/proyectlist.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        .activo,
        header .nav-enlaces a.activo i,
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
        }

        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        #acordeon-proyectos {
            width: 100%;
            max-width: 100%;
        }

        .ui-accordion .ui-accordion-header {
            font-size: 1rem !important;
            padding: 14px 18px !important;
            width: 100%;
            border-radius: 10px !important;
        }

        .ui-accordion-content {
            overflow-x: hidden !important;
            max-width: 100%;
        }

        .inner-content {
            max-width: 100%;
            word-wrap: break-word;
        }
    </style>
</head>

<body class="fondo-oscuro-neon">

<div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-principal">

    <!-- SIDEBAR -->
    <aside class="columna-perfil">

        <div class="tarjeta-perfil">

            <div class="perfil-superior">
                <div class="foto-perfil-contenedor">
                    <div class="circulo-foto"></div>
                    <div class="icono-corazon"><i class="fas fa-heart"></i></div>
                </div>

                <h2 class="nombre-usuario">
                    <span th:if="${usuario != null}" th:text="${usuario.username}"></span>
                </h2>
            </div>

            <div class="perfil-inferior">
                <ul class="redes-sociales">
                    <li><i class="fab fa-instagram"></i> Instagram</li>
                    <li><i class="fab fa-twitter"></i> Twitter</li>
                    <li><i class="fas fa-phone"></i> Teléfono</li>
                </ul>

                <button class="boton-curriculum">CURRICULUM</button>
            </div>

        </div>

        <div class="tarjeta-resenas-izq">
            <h3>RESEÑAS</h3>
            <textarea class="input-resena" placeholder="Escribe aquí..."></textarea>
            <button class="boton-anadir" onclick="window.location.href='/newreview'">
                Añadir reseña
            </button>
        </div>

    </aside>

    <!-- CONTENIDO -->
    <section class="seccion-derecha-dinamica">

        <div class="tarjeta-acordeon-contenedor">

            <div class="cabecera-acordeon">
                <h2>PROYECTOS</h2>
                <a href="/ownProfile" class="boton-volver-circular">
                    <i class="fas fa-undo"></i>
                </a>
            </div>

            <!-- ACORDEÓN -->
            <div id="acordeon-proyectos">

                <th:block th:each="p : ${proyectos}">

                    <h3 th:text="${p.titulo}">
                        Proyecto
                    </h3>

                    <div>
                        <div class="inner-content">

                            <p th:text="${p.descripcion}">
                                Descripción del proyecto...
                            </p>

                            <button class="boton-ver-proyecto"
                                    th:onclick="'window.location.href=\'/proyectos/proyecto/' + ${p.id} + '\';'">
                                VER PROYECTO
                            </button>

                        </div>
                    </div>

                </th:block>

            </div>

        </div>

    </section>

</main>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<script>
    $(function () {

        const $acc = $("#acordeon-proyectos");

        if ($acc.hasClass("ui-accordion")) {
            $acc.accordion("destroy");
        }

        $acc.accordion({
            collapsible: true,
            heightStyle: "content",
            active: false,
            animate: 200
        });

        inicializarHeaderProyectos();
    });

    function inicializarHeaderProyectos() {
        const navPerfil = document.getElementById('nav-perfil');

        if (navPerfil) {
            navPerfil.classList.add('activo');
        } else {
            document.querySelectorAll('header a').forEach(l => {
                if (l.href.includes('profileView') || l.href.includes('projectlist')) {
                    l.classList.add('activo');
                }
            });
        }
    }

    $(document).on("click", ".boton-ver-proyecto", function (e) {
        e.stopPropagation();
    });

</script>

</body>
</html>
