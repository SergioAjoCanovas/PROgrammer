<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Proyectos</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/projectlist_styles/proyectlist.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .activo,
        header .nav-enlaces a.activo i,
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
        }

        * { box-sizing: border-box; }
        body { overflow-x: hidden; }

        
        .contenedor-volver {
            max-width: 1800px;
            width: 98%;
            margin: 30px auto 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: flex-start;
        }

        .enlace-volver {
            color: #888888; 
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .enlace-volver:hover {
            color: #FFCC00; 
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.5); 
            transform: translateX(-5px); 
        }

        #acordeon-proyectos {
            width: 100%;
            max-width: 100%;
        }

        .ui-accordion .ui-accordion-header {
            font-size: 1rem !important;
            padding: 14px 18px !important;
            width: 100%;
            border-radius: 10px !important;
        }

        .ui-accordion-content {
            overflow-x: hidden !important;
            max-width: 100%;
        }

        .inner-content {
            max-width: 100%;
            word-wrap: break-word;
        }

        .botones-proyecto {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .botones-proyecto button {
            flex: 1;
        }

        .tech-tag-proyecto {
            background: rgba(0,243,255,0.1);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0,243,255,0.3);
            color: #00f3ff;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .tech-tag-proyecto:hover {
            background: rgba(0,243,255,0.2);
            box-shadow: 0 0 8px rgba(0,243,255,0.5);
            transform: translateY(-2px);
            color: white;
        }


        .circulo-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .foto-perfil-contenedor {
            position: relative;
            display: inline-block;
        }

        .btn-follow-heart {
            position: absolute;
            bottom: 8px;
            right: 0px;
            background: rgba(15, 5, 5, 0.8);
            border: 2px solid #ff4444;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ff4444;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
            z-index: 10;
        }

        .btn-follow-heart:hover {
            background: #ff4444;
            color: white;
            transform: scale(1.1);
        }

        .btn-follow-heart i.fas {
            color: #ff4444;
        }
        .btn-follow-heart:hover i.fas {
            color: white;
        }

        
        .ui-accordion-header-active .verificado-header {
            display: none !important;
        }

        /* --- TOAST NEON STYLE --- */
        .toast-success-neon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(5, 15, 5, 0.98);
            color: white;
            padding: 18px 28px;
            border-radius: 8px;
            border-left: 6px solid #39FF14;
            box-shadow: 0 8px 32px rgba(57, 255, 20, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }
        .toast-success-neon.mostrar {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-success-neon i {
            color: #39FF14;
            font-size: 2rem;
        }
        .toast-success-neon strong {
            display: block;
            color: #39FF14;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
    </style>
</head>

<body class="fondo-oscuro-neon">

<div th:replace="~{includes/header :: header}"></div>

<div class="contenedor-volver">
    <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.id == usuario.id}" 
       href="/ownProfile" 
       class="enlace-volver">
        <i class="fas fa-arrow-left"></i> Volver a tu perfil
    </a>

    <a th:unless="${session.usuarioLogueado != null and session.usuarioLogueado.id == usuario.id}" 
       th:href="'/profileView/' + ${usuario.id}" 
       class="enlace-volver">
        <i class="fas fa-arrow-left"></i> Ver perfil de <span th:text="${usuario.username}">Usuario</span>
    </a>
</div>

<main class="contenedor-principal">

    <aside class="columna-perfil">

        <div class="tarjeta-perfil">

            <div class="perfil-superior">
                <div class="foto-perfil-contenedor">
                    <div class="circulo-foto">
                        <img th:if="${usuario.fotoPerfil != null}" 
                             th:src="${usuario.fotoPerfil}" 
                             alt="foto perfil">

                        <i th:if="${usuario.fotoPerfil == null}" 
                           class="fas fa-user"></i>
                    </div>
                    <button th:if="${session.usuarioLogueado != null and session.usuarioLogueado.id != usuario.id}"
                            class="btn-follow-heart" 
                            th:attr="data-id=${usuario.id}" 
                            onclick="toggleFollowUser(this, event)">
                        <i class="fa-heart" th:classappend="${usuario.seguidores.contains(session.usuarioLogueado) ? 'fas' : 'far'}"></i>
                    </button>
                </div>
                <h2 class="nombre-usuario">
                    <span th:text="${usuario.username}"></span>
                    <i th:if="${usuario != null and (usuario.estado == 'VERIFICADO' or (usuario.rol != null and (usuario.rol.nombre == 'ADMIN' or usuario.rol.nombre == '1')))}" class="fas fa-check-circle" style="color: #00f2ff; margin-left: 5px; font-size: 0.85em;" title="Usuario Verificado"></i>
                </h2>
                <div style="text-align: center; margin-top: 5px; margin-bottom: 15px; color: #FFCC00; font-size: 0.9em; font-weight: bold;">
                    <i class="fas fa-users"></i> <span th:text="${usuario.followersCountFormatted}">0</span> <span th:text="${usuario.followersCount == 1 ? 'Seguidor' : 'Seguidores'}">Seguidores</span>
                </div>

                <div th:if="${media > 0}" 
                     style="margin-top: 10px; color: #FFCC00; font-size: 0.9rem; font-weight: bold;">
                    Valoración: <span th:text="${media}"></span> ⭐
                </div>
            </div>

            <div class="perfil-inferior">

                <div class="lista-dotted">

                <a th:if="${usuario.github != null}"
                th:href="${usuario.github}"
                target="_blank"
                class="item-dotted">

                    <i class="fab fa-github"></i>
                    <span>Mi GitHub</span>
                </a>

                <a th:if="${usuario.linkedin != null}"
                th:href="${usuario.linkedin}"
                target="_blank"
                class="item-dotted">

                    <i class="fab fa-linkedin"></i>
                    <span>Mi LinkedIn</span>
                </a>

                <a th:if="${cvUrl != null}"
                th:href="${cvUrl}"
                target="_blank"
                class="item-dotted">

                    <i class="fas fa-file-alt"></i>
                    <span th:text="${cvNombre}">Mi CV</span>
                </a>

            </div>

            </div>

        </div>

    </aside>

    <section class="seccion-derecha-dinamica">

        <div class="tarjeta-acordeon-contenedor">

            <div class="cabecera-acordeon">
                <h2 th:text="${#lists.isEmpty(proyectos) ? 'Ningún proyecto publicado' : (#lists.size(proyectos) == 1 ? '1 PROYECTO' : #lists.size(proyectos) + ' PROYECTOS')}">
                    PROYECTOS
                </h2>
                <a href="javascript:void(0)" onclick="volverDesdeProjectList()" class="boton-volver-circular">
                    <i class="fas fa-undo"></i>
                </a>
            </div>

            <div id="acordeon-proyectos" th:classappend="${#lists.size(proyectos) > 6} ? 'contenedor-scroll-neon' : ''">

                <th:block th:if="${!#lists.isEmpty(proyectos)}" th:each="p : ${proyectos}">

                    <h3>
                        <span th:text="${p.titulo}"></span>
                        <span th:if="${p.estaValidado}" class="verificado-header" style="background: rgba(0, 242, 255, 0.1); color: #00f2ff; border: 1px solid #00f2ff; font-size: 0.6em; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 10px; vertical-align: middle;">
                            <i class="fas fa-check-circle"></i> VERIFICADO
                        </span>
                    </h3>

                    <div>
                        <div class="inner-content">

                            <div th:if="${p.estaValidado}" style="margin-bottom: 15px;">
                                <span style="background: rgba(0, 242, 255, 0.1); color: #00f2ff; border: 1px solid #00f2ff; font-size: 0.75em; padding: 4px 10px; border-radius: 6px; font-weight: bold; box-shadow: 0 0 10px rgba(0,242,255,0.2);">
                                    <i class="fas fa-check-circle"></i> VERIFICADO
                                </span>
                            </div>

                            <p th:text="${p.descripcion}"></p>

                            <div th:if="${p.tecnologias != null and !p.tecnologias.isEmpty()}" style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
                                <span th:each="tech : ${p.tecnologias}" th:text="${tech.nombre}" class="tech-tag-proyecto">
                                </span>
                            </div>

                            <div class="botones-proyecto">

                                <button class="boton-ver-proyecto"
                                        th:onclick="'window.location.href=\'/proyectos/proyecto/' + ${p.id} + '\';'">
                                    VER PROYECTO
                                </button>

                                <button th:if="${session.usuarioLogueado != null and (session.usuarioLogueado.id == usuario.id or ((session.usuarioLogueado.rol.id == 1 or session.usuarioLogueado.rol.nombre == 'ADMIN') and usuario.rol.id != 1 and usuario.rol.nombre != 'ADMIN'))}"
                                 class="boton-editar-proyecto" 
                                 th:onclick="'window.location.href=\'/proyectos/editar/' + ${p.id} + '\';'">
                                 EDITAR PROYECTO
                                </button>

                                <button th:if="${session.usuarioLogueado != null and (session.usuarioLogueado.id == usuario.id or ((session.usuarioLogueado.rol.id == 1 or session.usuarioLogueado.rol.nombre == 'ADMIN') and usuario.rol.id != 1 and usuario.rol.nombre != 'ADMIN'))}"
                                        class="boton-eliminar-proyecto"
                                        th:attr="data-id=${p.id}"
                                        onclick="confirmarEliminarProyecto(this)">
                                    BORRAR PROYECTO
                                </button>

                            </div>

                        </div>
                    </div>

                </th:block>

            </div>

        </div>

    </section>

</main>



<div id="toast-success-proyecto" class="toast-success-neon">
    <i class="fas fa-check-circle"></i>
    <div>
        <strong>Éxito</strong>
        <span id="toast-mensaje-proyecto" style="font-size: 0.9rem; color: #eee;">Proyecto eliminado correctamente</span>
    </div>
</div>

<div th:replace="~{includes/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<script>

$(function () {
    const $acc = $("#acordeon-proyectos");

    if ($acc.hasClass("ui-accordion")) {
        $acc.accordion("destroy");
    }

    $acc.accordion({
        collapsible: true,
        heightStyle: "content",
        active: false,
        animate: 200
    });

    inicializarHeaderProyectos();
});

function inicializarHeaderProyectos() {
    document.querySelectorAll('header a').forEach(l => {
        if (l.href.includes('projectlist')) {
            l.classList.add('activo');
        }
    });
}

$(document).on("click", ".boton-ver-proyecto, .boton-eliminar-proyecto", function (e) {
    e.stopPropagation();
});

function confirmarEliminarProyecto(btn) {
    const id = btn.getAttribute("data-id");
    Swal.fire({
        title: '¿Seguro que quieres borrar este proyecto?',
        text: "Esta acción no se puede deshacer.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ff4444',
        cancelButtonColor: '#333',
        confirmButtonText: 'Sí, borrar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#fff'
    }).then((result) => {
        if (result.isConfirmed) {
            eliminarProyecto(id);
        }
    });
}

function eliminarProyecto(id) {
    fetch("/proyectos/delete/" + id, {
        method: "POST"
    })
    .then(res => res.text())
    .then(data => {
        if (data === "OK") {
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('success', 'deleted');
            window.location.href = currentUrl.toString();
        }
    });
}

// --- LÓGICA PARA MOSTRAR EL TOAST ---
window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('success')) {
        const type = urlParams.get('success');
        const toast = document.getElementById('toast-success-proyecto');
        const mensaje = document.getElementById('toast-mensaje-proyecto');
        
        if (toast && mensaje) {
            if (type === 'deleted') {
                mensaje.textContent = 'Proyecto eliminado correctamente';
            } else if (type === 'updated') {
                mensaje.textContent = 'Proyecto actualizado correctamente';
            }
            
            toast.classList.add('mostrar');
            setTimeout(() => {
                toast.classList.remove('mostrar');
                // Limpiar la URL sin recargar
                const cleanUrl = window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }, 4000);
        }
    }
});

async function toggleFollowUser(btn, event) {
    event.stopPropagation();
    const targetId = btn.getAttribute('data-id');
    const icon = btn.querySelector('i');
    const isFollowing = icon.classList.contains('fas');

    if (isFollowing) {
        const targetName = btn.getAttribute('data-username') || 'este usuario';
        const result = await mostrarModalUnfollowGlobal(targetName);

        if (!result.isConfirmed) {
            return;
        }
    }

    try {
        const formData = new FormData();
        formData.append('targetId', targetId);
        
        const response = await fetch('/usuario/toggleFollow', {
            method: 'POST',
            body: formData
        });
        const result = await response.text();
        
        if (result === 'OK') {
            if (icon.classList.contains('far')) {
                icon.classList.remove('far');
                icon.classList.add('fas');
            } else {
                icon.classList.remove('fas');
                icon.classList.add('far');
            }
        } else if (result === 'NOT_LOGGED') {
            window.location.href = '/login';
        } else {
            alert('Error al seguir al usuario: ' + result);
        }
    } catch (error) {
        console.error('Error toggling follow:', error);
    }
}

function volverDesdeProjectList() {
    if (document.referrer.includes("/ownProfile")) {
        window.location.href = "/ownProfile";
    } else {
        window.location.href = "/profileView/[[${usuario.id}]]";
    }
}
</script>

</body>
</html>
