<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Buscar Perfiles</title>
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/homePage_styles/searchProgrammer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* IMPORTANTE: Usamos selectores más específicos para ganarle a otros estilos */
        .activo, 
        header .nav-enlaces a.activo i, 
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="body-layout fondo-oscuro-neon">
    
    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-busqueda">
        <section class="seccion-buscador-central">
            <h1 class="titulo-neon">CONECTA CON <span class="resaltado">PROGRAMADORES</span></h1>
            <div class="caja-busqueda-neon">
                <input type="text" placeholder="Busca por nombre, lenguaje o tecnología...">
                <button class="btn-buscar-neon">
                    <i class="fas fa-terminal"></i> BUSCAR
                </button>
            </div>
        </section>

        <section class="seccion-carrusel">
            <h2 class="subtitulo-neon">Perfiles Destacados</h2>
            <div class="carrusel-wrapper">
                <button class="btn-nav prev" onclick="moverCarrusel(-1)"><i class="fas fa-chevron-left"></i></button>
                <div class="carrusel-contenedor">
                    <div class="carrusel-track" id="track">
                        <div class="tarjeta-perfil-neon">
                            <div class="foto-perfil-dummy"></div>
                            <h3>David Alcázar</h3>
                            <p>Full Stack Developer</p>
                            <div class="tags"><span>Java</span><span>Python</span></div>
                            <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                        </div>
                        <div class="tarjeta-perfil-neon">
                            <div class="foto-perfil-dummy"></div>
                            <h3>Cristian Escobar</h3>
                            <p>UI/UX Designer</p>
                            <div class="tags"><span>Figma</span><span>CSS3</span></div>
                            <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                        </div>
                        <div class="tarjeta-perfil-neon">
                            <div class="foto-perfil-dummy"></div>
                            <h3>Sergio Ajo</h3>
                            <p>Backend Engineer</p>
                            <div class="tags"><span>Node.js</span><span>SQL</span></div>
                            <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                        </div>
                        <div class="tarjeta-perfil-neon">
                            <div class="foto-perfil-dummy"></div>
                            <h3>Ana Felicia</h3>
                            <p>Fronted Engineer</p>
                            <div class="tags"><span>CSS</span><span>HTML</span></div>
                            <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                        </div>
                    </div>
                </div>
                <button class="btn-nav next" onclick="moverCarrusel(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
    function inicializarHeader() {
        const contenedor = document.getElementById('info-usuario');

        // 2. ILUMINAR ICONO (DOBLE COMPROBACIÓN)
        // Intento A: Por ID
        const navRed = document.getElementById('nav-red'); 
        if (navRed) {
            navRed.classList.add('activo');
        } else {
            // Intento B: Por URL si el ID fallase
            const todosLosLinks = document.querySelectorAll('header a');
            todosLosLinks.forEach(link => {
                if (link.getAttribute('href') === '/searchProgrammer' || link.getAttribute('href')?.includes('searchProgrammer')) {
                    link.classList.add('activo');
                }
            });
        }
    }

    // --- LÓGICA DEL CARRUSEL ---
    const track = document.getElementById('track');
    let index = 0;
    const cardStep = 290; 

    function actualizarCarrusel() {
        const totalCards = document.querySelectorAll('.tarjeta-perfil-neon').length;
        const visibleCards = window.innerWidth <= 1050 ? 1 : 3;
        const maxIndex = Math.max(0, totalCards - visibleCards);
        if (index > maxIndex) index = 0;
        if (index < 0) index = maxIndex;
        track.style.transform = `translateX(-${index * cardStep}px)`;
    }

    function moverCarrusel(direccion) {
        index += direccion;
        actualizarCarrusel();
        reiniciarIntervalo();
    }

    let intervalo = setInterval(() => { index++; actualizarCarrusel(); }, 5000);
    function reiniciarIntervalo() { 
        clearInterval(intervalo); 
        intervalo = setInterval(() => { index++; actualizarCarrusel(); }, 5000); 
    }

    window.addEventListener('resize', actualizarCarrusel);
    
    window.addEventListener('load', () => {
        // Ejecutamos con varios intentos por si Thymeleaf es lento inyectando el fragmento
        setTimeout(inicializarHeader, 50);
        setTimeout(inicializarHeader, 300);
        actualizarCarrusel();
    });
    </script>
</body>
</html>
