<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Buscar Perfiles</title>
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/homePage_styles/searchProgrammer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* IMPORTANTE: Usamos selectores más específicos para ganarle a otros estilos */
        .activo, 
        header .nav-enlaces a.activo i, 
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="body-layout fondo-oscuro-neon">
    
    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-busqueda">
        <section class="seccion-buscador-central">
            <h1 class="titulo-neon">CONECTA CON <span class="resaltado">PROGRAMADORES</span></h1>
            <form action="/searchProgrammer/search" method="get" class="caja-busqueda-neon" autocomplete="off">
                <input type="text" name="query" placeholder="Pincha aquí para buscar programadores Ej: Alicia Fernandez" th:value="${searchQuery}" autocomplete="off" spellcheck="false" required>
                <button type="submit" class="btn-buscar-neon">
                    <i class="fas fa-terminal"></i> BUSCAR
                </button>
            </form>
        </section>

        <section class="seccion-carrusel">
            <h2 class="subtitulo-neon" th:text="${searchQuery != null} ? 'Resultados de Búsqueda' : 'Perfiles Destacados'"></h2>
            <div th:if="${searchQuery != null}" class="contador-resultados">
                <span class="contador-texto">Perfiles encontrados por "</span>
                <span class="contador-query" th:text="${#strings.trim(searchQuery)}"></span>
                <span class="contador-texto">":</span>
                <span class="contador-numero" th:text="${resultCount}"></span>
            </div>
            <div class="carrusel-wrapper" th:if="${searchQuery == null}">
                <button class="btn-nav prev" onclick="moverCarrusel(-1)"><i class="fas fa-chevron-left"></i></button>
                <div class="carrusel-contenedor">
                    <div class="carrusel-track" id="track">
                        <div class="tarjeta-perfil-neon" th:each="developer : ${developers}" th:with="bio=${developer.biografia != null and !#strings.isEmpty(developer.biografia.trim()) ? developer.biografia : (developer.usuario.biografia != null and !#strings.isEmpty(developer.usuario.biografia.trim()) ? developer.usuario.biografia : 'Sin descripción')}">
                            <img th:src="${developer.usuario.fotoPerfil != null ? developer.usuario.fotoPerfil : '/Img/stock/default-profile.png'}" alt="Foto de perfil" class="foto-perfil">
                            <h3 th:text="${developer.usuario.username}"></h3>
                            <div class="bio"
                                 th:attr="data-full-bio=${bio}"
                                 th:text="${bio}"></div>
                            <div class="tags-container">
                                <div class="tags">
                                    <span th:each="tech, iterStat : ${developer.tecnologias}" th:if="${iterStat.index < 3}" th:text="${tech.nombre}"></span>
                                </div>
                                <i th:if="${developer.tecnologias.size() > 3}" class="fas fa-plus tech-toggle" onclick="toggleTechDropdown(this)"></i>
                                <div th:if="${developer.tecnologias.size() > 3}" class="tech-dropdown">
                                    <span th:each="tech : ${developer.tecnologias}" th:text="${tech.nombre}"></span>
                                </div>
                            </div>
                            <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                        </div>
                    </div>
                </div>
                <button class="btn-nav next" onclick="moverCarrusel(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="grid-resultados" th:if="${searchQuery != null}">
                <div class="tarjeta-perfil-neon" th:each="developer : ${developers}" th:with="bio=${developer.biografia != null and !#strings.isEmpty(developer.biografia.trim()) ? developer.biografia : (developer.usuario.biografia != null and !#strings.isEmpty(developer.usuario.biografia.trim()) ? developer.usuario.biografia : 'Sin descripción')}">
                    <img th:src="${developer.usuario.fotoPerfil != null ? developer.usuario.fotoPerfil : '/Img/stock/default-profile.png'}" alt="Foto de perfil" class="foto-perfil">
                    <h3 th:text="${developer.usuario.username}"></h3>
                    <div class="bio"
                         th:attr="data-full-bio=${bio}"
                         th:text="${bio}"></div>
                    <div class="tags-container">
                        <div class="tags">
                            <span th:each="tech, iterStat : ${developer.tecnologias}" th:if="${iterStat.index < 3}" th:text="${tech.nombre}"></span>
                        </div>
                        <i th:if="${developer.tecnologias.size() > 3}" class="fas fa-plus tech-toggle" onclick="toggleTechDropdown(this)"></i>
                        <div th:if="${developer.tecnologias.size() > 3}" class="tech-dropdown">
                            <span th:each="tech : ${developer.tecnologias}" th:text="${tech.nombre}"></span>
                        </div>
                    </div>
                    <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
    function inicializarHeader() {
        const contenedor = document.getElementById('info-usuario');

        // 2. ILUMINAR ICONO (DOBLE COMPROBACIÓN)
        // Intento A: Por ID
        const navRed = document.getElementById('nav-red'); 
        if (navRed) {
            navRed.classList.add('activo');
        } else {
            // Intento B: Por URL si el ID fallase
            const todosLosLinks = document.querySelectorAll('header a');
            todosLosLinks.forEach(link => {
                if (link.getAttribute('href') === '/searchProgrammer' || link.getAttribute('href')?.includes('searchProgrammer')) {
                    link.classList.add('activo');
                }
            });
        }
    }

    // --- LÓGICA DEL CARRUSEL ---
    const track = document.getElementById('track');
    let index = 0;
    const cardStep = 290; 

    function actualizarCarrusel() {
        const totalCards = document.querySelectorAll('.tarjeta-perfil-neon').length;
        const visibleCards = window.innerWidth <= 1050 ? 1 : 3;
        const maxIndex = Math.max(0, totalCards - visibleCards);
        if (index > maxIndex) index = 0;
        if (index < 0) index = maxIndex;
        track.style.transform = `translateX(-${index * cardStep}px)`;
    }

    function moverCarrusel(direccion) {
        index += direccion;
        actualizarCarrusel();
        reiniciarIntervalo();
    }

    function toggleTechDropdown(toggle) {
        const card = toggle.closest('.tarjeta-perfil-neon');
        const dropdown = card.querySelector('.tech-dropdown');
        dropdown.classList.toggle('show');
        toggle.classList.toggle('active');
    }

    function initializeBioPreviews() {
        const bioElements = document.querySelectorAll('.bio');
        bioElements.forEach(bio => {
            const fullBio = bio.dataset.fullBio?.trim() ?? '';
            if (!fullBio || fullBio === 'Sin descripción') {
                bio.textContent = 'Sin descripción';
                return;
            }
            bio.textContent = fullBio;
        });
    }

    let intervalo = setInterval(() => { index++; actualizarCarrusel(); }, 5000);
    function reiniciarIntervalo() { 
        clearInterval(intervalo); 
        intervalo = setInterval(() => { index++; actualizarCarrusel(); }, 5000); 
    }

    window.addEventListener('resize', actualizarCarrusel);
    
    window.addEventListener('load', () => {
        // Ejecutamos con varios intentos por si Thymeleaf es lento inyectando el fragmento
        setTimeout(inicializarHeader, 50);
        setTimeout(inicializarHeader, 300);
        initializeBioPreviews();
        actualizarCarrusel();
    });
    </script>
</body>
</html>
