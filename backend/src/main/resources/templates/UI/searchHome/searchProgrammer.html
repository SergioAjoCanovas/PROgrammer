<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Buscar Perfiles</title>
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/homePage_styles/searchProgrammer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .activo, 
        header .nav-enlaces a.activo i, 
        header .nav-enlaces a.activo span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00 !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="body-layout fondo-oscuro-neon">
    
    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-busqueda">
        <section class="seccion-buscador-central">
            <h1 class="titulo-neon">CONECTA CON <span class="resaltado">PROGRAMADORES</span></h1>
            
            <form action="/searchProgrammer/search" method="get" class="caja-busqueda-neon" autocomplete="off" id="searchForm">
                <div class="input-wrapper">
                    <button type="button" class="funnel-icon" id="funnelBtn">
                        <i class="fas fa-filter"></i>
                    </button>
                    <input type="text" name="query" placeholder="Pincha aquí para buscar programadores Ej: Alicia Fernandez" th:value="${searchQuery}" autocomplete="off" spellcheck="false" required>
                    <button type="submit" class="btn-buscar-neon">
                        <i class="fas fa-terminal"></i> BUSCAR
                    </button>
                </div>

                <div class="tech-dropdown" id="techDropdown">
                    <div class="controles-globales">
                        <button type="button" class="btn-control" id="selectAll">Seleccionar Todos</button>
                        <button type="button" class="btn-control" id="deselectAll">Deseleccionar Todos</button>
                    </div>
                    <div class="grid-checkboxes">
                        <label th:each="tech : ${allTechnologies}" class="item-tech">
                            <input type="checkbox" name="tech" th:value="${tech.id}">
                            <span th:text="${tech.nombre}"></span>
                            <div class="tick-minimalista">
                                <i class="fas fa-check"></i>
                            </div>
                        </label>
                    </div>
                </div>
            </form>
        </section>

        <section class="seccion-carrusel">
            <h2 class="subtitulo-neon" th:text="${searchQuery != null} ? 'Resultados de Búsqueda' : 'Perfiles Destacados'"></h2>
            
            <div th:class="${searchQuery == null} ? 'carrusel-wrapper' : 'grid-resultados'">
                <button th:if="${searchQuery == null}" class="btn-nav prev" onclick="moverCarrusel(-1)"><i class="fas fa-chevron-left"></i></button>
                
                <div th:class="${searchQuery == null} ? 'carrusel-contenedor' : ''">
                    <div th:id="${searchQuery == null} ? 'track' : ''" th:class="${searchQuery == null} ? 'carrusel-track' : 'grid-resultados-inner'">
                        
                        <div class="tarjeta-perfil-neon" th:each="developer : ${developers}" 
                             th:with="fullBio=${developer.biografia != null and !#strings.isEmpty(developer.biografia.trim()) ? developer.biografia : (developer.usuario.biografia != null and !#strings.isEmpty(developer.usuario.biografia.trim()) ? developer.usuario.biografia : 'Sin descripción')},
                                      esLarga=${#strings.length(fullBio) > 60}">
                            
                            <div class="contenido-perfil">
                                <img th:src="${developer.usuario.fotoPerfil != null ? developer.usuario.fotoPerfil : '/Img/stock/default-profile.png'}" alt="Foto de perfil" class="foto-perfil">
                                <h3 th:text="${developer.usuario.username}"></h3>
                                
                                <div th:class="${esLarga} ? 'bio-recortada interactiva' : 'bio-recortada'" 
                                     th:onclick="${esLarga} ? 'toggleBioExpansion(this)' : ''">
                                    <p th:text="${esLarga ? #strings.substring(fullBio,0,60) + '...' : fullBio}"></p>
                                </div>
                                
                                <div class="tags-container">
                                    <div class="tags">
                                        <span th:each="tech, iterStat : ${developer.tecnologias}" th:if="${iterStat.index < 3}" th:text="${tech.nombre}"></span>
                                    </div>
                                    <i th:if="${developer.tecnologias.size() > 3}" class="fas fa-plus tech-toggle" onclick="toggleTechExpansion(this)"></i>
                                </div>
                                <button class="btn-perfil" onclick="window.location.href='/profileView'">Ver Perfil</button>
                            </div>

                            <div class="vista-todas-techs">
                                <i class="fas fa-times close-overlay" onclick="toggleTechExpansion(this)"></i>
                                <h4 class="titulo-overlay">Tecnologías</h4>
                                <div class="grid-techs-3">
                                    <span th:each="tech : ${developer.tecnologias}" th:text="${tech.nombre}"></span>
                                </div>
                            </div>

                            <div class="vista-bio-completa" th:if="${esLarga}">
                                <i class="fas fa-times close-overlay" onclick="toggleBioExpansion(this)"></i>
                                <h4 class="titulo-overlay">Sobre mí</h4>
                                <div class="caja-bio-full">
                                    <p th:text="${fullBio}"></p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                
                <button th:if="${searchQuery == null}" class="btn-nav next" onclick="moverCarrusel(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
    function inicializarHeader() {
        const navRed = document.getElementById('nav-red'); 
        if (navRed) navRed.classList.add('activo');
    }

    const funnelBtn = document.getElementById('funnelBtn');
    const techDropdown = document.getElementById('techDropdown');
    const btnSelectAll = document.getElementById('selectAll');
    const btnDeselectAll = document.getElementById('deselectAll');

    if(funnelBtn) {
        funnelBtn.addEventListener('click', () => {
            techDropdown.classList.toggle('show');
            funnelBtn.classList.toggle('active');
        });
    }

    function actualizarEstadoBotonesGlobales() {
        const total = document.querySelectorAll('.item-tech input').length;
        const seleccionados = document.querySelectorAll('.item-tech input:checked').length;

        btnSelectAll.classList.remove('btn-active');
        btnDeselectAll.classList.remove('btn-active');

        if (seleccionados === total && total > 0) {
            btnSelectAll.classList.add('btn-active');
        } else if (seleccionados === 0) {
            btnDeselectAll.classList.add('btn-active');
        }
    }

    document.querySelectorAll('.item-tech').forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            const checkbox = this.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            this.classList.toggle('selected', checkbox.checked);
            actualizarEstadoBotonesGlobales();
        });
    });

    btnSelectAll?.addEventListener('click', () => {
        document.querySelectorAll('.item-tech').forEach(item => {
            item.querySelector('input').checked = true;
            item.classList.add('selected');
        });
        actualizarEstadoBotonesGlobales();
    });

    btnDeselectAll?.addEventListener('click', () => {
        document.querySelectorAll('.item-tech').forEach(item => {
            item.querySelector('input').checked = false;
            item.classList.remove('selected');
        });
        actualizarEstadoBotonesGlobales();
    });

    function toggleTechExpansion(element) {
        const tarjeta = element.closest('.tarjeta-perfil-neon');
        tarjeta.classList.toggle('tech-expanded');
    }

    function toggleBioExpansion(element) {
        const tarjeta = element.closest('.tarjeta-perfil-neon');
        tarjeta.classList.toggle('bio-expanded');
    }

    const track = document.getElementById('track');
    let index = 0;
    const cardStep = 290; 
    let autoPlayInterval;

    function actualizarCarrusel() {
        if(!track) return;
        const totalCards = track.querySelectorAll('.tarjeta-perfil-neon').length;
        const visibleCards = window.innerWidth <= 1050 ? 1 : 3;
        const maxIndex = Math.max(0, totalCards - visibleCards);
        if (index > maxIndex) index = 0;
        if (index < 0) index = maxIndex;
        track.style.transform = `translateX(-${index * cardStep}px)`;
    }

    function moverCarrusel(direccion) {
        index += direccion;
        actualizarCarrusel();
        reiniciarAutoPlay();
    }

    function startAutoPlay() {
        if(!track) return;
        autoPlayInterval = setInterval(() => {
            index++;
            actualizarCarrusel();
        }, 4000);
    }

    function reiniciarAutoPlay() {
        clearInterval(autoPlayInterval);
        startAutoPlay();
    }

    window.addEventListener('resize', actualizarCarrusel);
    window.addEventListener('load', () => {
        inicializarHeader();
        actualizarCarrusel();
        startAutoPlay();
        
        btnSelectAll?.click();
    });
    </script>
</body>
</html>
