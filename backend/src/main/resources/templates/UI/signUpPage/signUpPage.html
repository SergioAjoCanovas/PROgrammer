<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/loginPage_styles/loginPage.css">
    <link rel="stylesheet" href="/Style/signUpPage_styles/signUpPage.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <title>Registro - PROgrammer</title>
    <style>
        /* ESTILO DEL TOAST DE ERROR NEÓN */
        .toast-error-neon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(15, 5, 5, 0.98); /* Fondo muy oscuro con tinte rojizo */
            color: white;
            padding: 18px 28px;
            border-radius: 8px;
            border-left: 6px solid #ff4444; /* Rojo neón */
            box-shadow: 0 8px 32px rgba(255, 68, 68, 0.3); /* Resplandor rojo */
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }

        .toast-error-neon.mostrar {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-error-neon i {
            color: #ff4444;
            font-size: 2rem;
        }

        .toast-error-neon strong {
            display: block;
            color: #ff4444;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <main class="contenedor-login">
        <div class="login-card tarjeta-acordeon">
            <img src="/Img/logo_sin_silla_de_ruedas-removebg-preview.png" alt="Logotipo PROgrammer" class="login-logo"/>
            
            <h2>Crear cuenta</h2>
            
            <form th:action="@{/api/auth/signup}" method="POST" class="login-form" enctype="multipart/form-data">
                
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ej: John Doe" required/>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@email.com" required/>
                </div>

                <div class="input-group">
                    <label for="foto">Foto de Perfil (Opcional)</label>
                    <input type="file" id="foto" name="foto" accept="image/*" />
                </div>

                <div class="input-group">
                    <label for="id_rol">¿Qué tipo de perfil buscas?</label>
                    <div class="select-wrapper">
                        <select id="id_rol" name="id_rol" required>
                            <option value="" disabled selected>Selecciona tu perfil...</option>
                            <option value="4">Usuario normal (Explorar)</option>
                            <option value="2">Desarrollador (Busco proyectos)</option>
                            <option value="3">Empresa (Busco talento)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
                        <i class="far fa-eye toggle-password" data-target="password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Repetir Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Vuelve a escribirla" required>
                        <i class="far fa-eye toggle-password" data-target="confirm_password"></i>
                    </div>
                </div>

                <button type="submit" class="boton-ver" style="margin-top: 10px; width: 100%;">Registrarme</button>
                
                <div class="registro-link">
                    <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
                </div>

            </form>
        </div>
    </main>

    <div id="toast-signup-error" class="toast-error-neon">
        <i class="fas fa-exclamation-circle"></i>
        <div>
            <strong id="toast-error-titulo">Error de registro</strong>
            <span id="toast-error-mensaje" style="font-size: 0.9rem; color: #eee;">El usuario o email ya existen.</span>
        </div>
    </div>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        // --- 1. LÓGICA MOSTRAR/OCULTAR CONTRASEÑA ---
        const togglePasswords = document.querySelectorAll('.toggle-password');

        togglePasswords.forEach(function(icon) {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);

                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Cambiar el icono
                this.classList.toggle('fa-eye-slash');
                this.classList.toggle('fa-eye');
            });
        });

        // --- 2. VALIDACIÓN BÁSICA (Opcional) ---
        const form = document.querySelector('.login-form');
        form.addEventListener('submit', (e) => {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (pass !== confirm) {
                e.preventDefault();
                alert("Las contraseñas no coinciden. Por favor, verifica.");
            }
        });

        // --- 3. LÓGICA PARA DETECTAR ERRORES EN LA URL Y MOSTRAR EL TOAST ---
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const toast = document.getElementById('toast-signup-error');
            
            if (urlParams.has('error')) {
                // Mostrar el toast
                setTimeout(() => {
                    toast.classList.add('mostrar');
                }, 100);

                // Limpiar la URL para que no vuelva a salir al recargar
                window.history.replaceState({}, document.title, window.location.pathname);

                // Ocultar automáticamente tras 5 segundos
                setTimeout(() => {
                    toast.classList.remove('mostrar');
                }, 5000);
            }
        });
    </script>

</body>
</html>
