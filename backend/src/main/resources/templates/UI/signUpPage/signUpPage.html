<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/loginPage_styles/loginPage.css">
    <link rel="stylesheet" href="/Style/signUpPage_styles/signUpPage.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <title>Registro - PROgrammer</title>
    <style>
        /* ESTILO DEL TOAST DE ERROR NEÓN */
        .toast-error-neon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(15, 5, 5, 0.98); /* Fondo muy oscuro con tinte rojizo */
            color: white;
            padding: 18px 28px;
            border-radius: 8px;
            border-left: 6px solid #ff4444; /* Rojo neón */
            box-shadow: 0 8px 32px rgba(255, 68, 68, 0.3); /* Resplandor rojo */
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }

        .toast-error-neon.mostrar {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-error-neon i {
            color: #ff4444;
            font-size: 2rem;
        }

        .toast-error-neon strong {
            display: block;
            color: #ff4444;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body class="fondo-oscuro-neon">

    <main class="contenedor-login">
        <div class="login-card tarjeta-acordeon">
            <img src="/Img/logo_sin_silla_de_ruedas-removebg-preview.png" alt="Logotipo PROgrammer" class="login-logo"/>
            
            <h2>Crear cuenta</h2>
            
            <form th:action="@{/api/auth/signup}" method="POST" class="login-form" enctype="multipart/form-data">
                
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ej: John Doe" required/>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@email.com" required/>
                </div>

                <div class="input-group">
                    <label for="foto">Foto de Perfil (Opcional)</label>
                    <div class="file-input-wrapper" id="file-wrapper">
                        <input type="file" id="foto" name="foto" accept="image/*" />
                        <i class="fas fa-check-circle check-file" id="file-check"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="id_rol">¿Qué tipo de perfil buscas?</label>
                    <div class="select-wrapper">
                        <select id="id_rol" name="id_rol" required>
                            <option value="" disabled selected>Selecciona tu perfil...</option>
                            <option value="4">Usuario normal (Explorar)</option>
                            <option value="2">Desarrollador (Busco proyectos)</option>
                            <option value="3">Empresa (Busco talento)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
                        <i class="far fa-eye toggle-password" data-target="password"></i>
                    </div>
                    <!-- CONTENEDOR MEDIDOR NEÓN -->
                    <div class="password-strength">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <span id="strength-text" class="strength-text"></span>
                    
                    <ul class="password-requirements">
                        <li id="req-length" class="invalid"><i class="fas fa-times"></i> Min: 8 caracteres</li>
                        <li id="req-start" class="invalid"><i class="fas fa-times"></i> Que no empiece en número</li>
                        <li id="req-upper" class="invalid"><i class="fas fa-times"></i> Mínimo 1 mayúscula (A-Z)</li>
                        <li id="req-lower" class="invalid"><i class="fas fa-times"></i> Mínimo 1 minúscula (a-z)</li>
                        <li id="req-number" class="invalid"><i class="fas fa-times"></i> Mínimo 1 número (0-9)</li>
                        <li id="req-special" class="invalid"><i class="fas fa-times"></i> Opcional 1 carácter especial (ej. @,#,$,%)</li>
                    </ul>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Repetir Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Vuelve a escribirla" required>
                        <i class="far fa-eye toggle-password" data-target="confirm_password"></i>
                    </div>
                </div>

                <button type="submit" class="boton-ver" style="margin-top: 10px; width: 100%;">Registrarme</button>
                
                <div class="registro-link">
                    <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
                </div>

            </form>
        </div>
    </main>

    <div id="toast-signup-error" class="toast-error-neon">
        <i class="fas fa-exclamation-circle"></i>
        <div>
            <strong id="toast-error-titulo">Error de registro</strong>
            <span id="toast-error-mensaje" style="font-size: 0.9rem; color: #eee;">El usuario o email ya existen.</span>
        </div>
    </div>

    <div th:replace="~{includes/footer :: footer}"></div>

    <script>
        // --- 1. LÓGICA MOSTRAR/OCULTAR CONTRASEÑA ---
        const togglePasswords = document.querySelectorAll('.toggle-password');

        togglePasswords.forEach(function(icon) {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);

                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Cambiar el icono
                this.classList.toggle('fa-eye-slash');
                this.classList.toggle('fa-eye');
            });
        });

        // --- 1.5 LOGICA DE FOTO DE PERFIL ---
        const fileInput = document.getElementById('foto');
        const fileWrapper = document.getElementById('file-wrapper');
        
        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileWrapper.classList.add('file-selected');
            } else {
                fileWrapper.classList.remove('file-selected');
            }
        });

        // --- 2. VALIDACIÓN Y FUERZA DE CONTRASEÑA ---
        const form = document.querySelector('.login-form');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');

        // Elementos de la lista de requisitos
        const reqLength = document.getElementById('req-length');
        const reqStart = document.getElementById('req-start');
        const reqUpper = document.getElementById('req-upper');
        const reqLower = document.getElementById('req-lower');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        // Requisitos mínimos
        const minLength = 8;
        const hasUpper = /[A-Z]/;
        const hasLower = /[a-z]/;
        const hasNumber = /[0-9]/;
        const hasSpecial = /[^A-Za-z0-9]/;
        const startsWithNumber = /^[0-9]/;

        let passwordIsValid = false;

        function updateReq(el, isValid) {
            if (isValid) {
                el.classList.remove('invalid');
                el.classList.add('valid');
                el.querySelector('i').className = 'fas fa-check';
            } else {
                el.classList.remove('valid');
                el.classList.add('invalid');
                el.querySelector('i').className = 'fas fa-times';
            }
        }

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let level = 0;
            
            if (val.length > 0) {
                const meetsMinLength = val.length >= minLength;
                const meetsUpper = hasUpper.test(val);
                const meetsLower = hasLower.test(val);
                const meetsNumber = hasNumber.test(val);
                const meetsSpecial = hasSpecial.test(val);
                const doesntStartWithNumber = !startsWithNumber.test(val);
                
                updateReq(reqLength, meetsMinLength);
                updateReq(reqStart, doesntStartWithNumber);
                updateReq(reqUpper, meetsUpper);
                updateReq(reqLower, meetsLower);
                updateReq(reqNumber, meetsNumber);
                updateReq(reqSpecial, meetsSpecial);
                
                let rulesMet = 0;
                if (meetsUpper) rulesMet++;
                if (meetsLower) rulesMet++;
                if (meetsNumber) rulesMet++;
                if (meetsSpecial) rulesMet++;
                
                // Determinamos el nivel
                if (val.length < 6) {
                    level = 1; // Muy débil (Rojo)
                } else if (!meetsMinLength || rulesMet < 3 || !doesntStartWithNumber) {
                    level = 2; // Débil (Naranja)
                } else if (meetsMinLength && meetsUpper && meetsLower && meetsNumber && doesntStartWithNumber) {
                    level = 3; // Normal (Amarillo) - Cumple lo mínimo requerido
                    
                    if (meetsSpecial || val.length >= 10) {
                        level = 4; // Buena (Pistacho)
                    }
                    if (meetsSpecial && val.length >= 12) {
                        level = 5; // Muy Buena (Verde Oscuro)
                    }
                } else {
                    level = 1;
                }
                
                // Actualizamos validez
                passwordIsValid = meetsMinLength && meetsUpper && meetsLower && meetsNumber && doesntStartWithNumber;
            } else {
                level = 0;
                passwordIsValid = false;
                
                updateReq(reqLength, false);
                updateReq(reqStart, false);
                updateReq(reqUpper, false);
                updateReq(reqLower, false);
                updateReq(reqNumber, false);
                updateReq(reqSpecial, false);
            }

            // Actualizar UI
            strengthBar.className = 'strength-bar'; // Reset classes
            strengthText.className = 'strength-text';
            
            switch(level) {
                case 1:
                    strengthBar.classList.add('strength-1');
                    strengthText.classList.add('text-1');
                    strengthText.textContent = 'Nivel: Muy débil';
                    break;
                case 2:
                    strengthBar.classList.add('strength-2');
                    strengthText.classList.add('text-2');
                    strengthText.textContent = 'Nivel: Débil';
                    break;
                case 3:
                    strengthBar.classList.add('strength-3');
                    strengthText.classList.add('text-3');
                    strengthText.textContent = 'Nivel: Normal';
                    break;
                case 4:
                    strengthBar.classList.add('strength-4');
                    strengthText.classList.add('text-4');
                    strengthText.textContent = 'Nivel: Buena';
                    break;
                case 5:
                    strengthBar.classList.add('strength-5');
                    strengthText.classList.add('text-5');
                    strengthText.textContent = 'Nivel: Muy Buena';
                    break;
                default:
                    strengthText.textContent = '';
                    break;
            }
        });

        function showToast(title, message) {
            const toast = document.getElementById('toast-signup-error');
            document.getElementById('toast-error-titulo').textContent = title;
            document.getElementById('toast-error-mensaje').textContent = message;
            
            toast.classList.add('mostrar');
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 5000);
        }

        form.addEventListener('submit', (e) => {
            const pass = passwordInput.value;
            const confirm = document.getElementById('confirm_password').value;
            const rolSelect = document.getElementById('id_rol');

            if (!rolSelect.value) {
                e.preventDefault();
                showToast("Faltan campos", "Por favor, selecciona qué tipo de perfil buscas.");
                return;
            }

            if (!passwordIsValid) {
                e.preventDefault();
                showToast("Contraseña no válida", "La contraseña no cumple con los requisitos mínimos.");
                return;
            }

            if (pass !== confirm) {
                e.preventDefault();
                showToast("Contraseñas no coinciden", "Las contraseñas que has introducido son diferentes.");
            }
        });

        // --- 3. LÓGICA PARA DETECTAR ERRORES EN LA URL Y MOSTRAR EL TOAST ---
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const toast = document.getElementById('toast-signup-error');
            
            if (urlParams.has('error')) {
                // El error que viene de la URL (si ya existe el email, etc.)
                showToast("Error de registro", "El usuario o email ya existen.");

                // Limpiar la URL para que no vuelva a salir al recargar
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>

</body>
</html>
