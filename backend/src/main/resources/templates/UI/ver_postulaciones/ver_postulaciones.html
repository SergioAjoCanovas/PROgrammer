<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Postulaciones</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/jobsearching_styles/jobsearching_styles.css">
    <link rel="stylesheet" href="/Style/verPostulaciones_styles/verPostulaciones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-layout fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-ofertas">
        
        <div style="margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 20px;">
            
            <div style="display: flex; align-items: center;">
                <a href="javascript:history.back()" class="enlace-volver">
                    <i class="fas fa-arrow-left"></i> Volver a mis ofertas
                </a>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <h2 style="margin: 0; font-size: 1.8rem; color: #FFCC00;">
                    Candidatos para: <span th:text="${oferta.titulo}" style="color: white;"></span>
                </h2>
                <p style="color: #ccc; font-size: 0.95rem; margin-top: 10px;">
                    Revisa los perfiles de los desarrolladores que han aplicado a tu oferta.
                </p>
            </div>
        </div>

        <div th:each="post : ${postulaciones}" class="candidato-card">
            <img th:src="${post.desarrollador.fotoPerfil != null ? post.desarrollador.fotoPerfil : '/Img/default-avatar.png'}" class="avatar-candidato">
            
            <div style="flex: 1;">
                <h3 th:text="${post.desarrollador.username}" style="color: white; margin: 0 0 5px 0; font-size: 1.2rem;"></h3>
                <span style="color: #666; font-size: 0.8rem;"><i class="fas fa-envelope"></i> <span th:text="${post.desarrollador.email}"></span></span>
                
                <div th:if="${post.mensajeAdjunto != null && !post.mensajeAdjunto.isEmpty()}" class="caja-mensaje">
                    <i class="fas fa-quote-left" style="color: #FFCC00; opacity: 0.5; margin-right: 8px;"></i>
                    <span th:text="${post.mensajeAdjunto}"></span>
                </div>
                
                <div th:if="${post.proyectoVinculado != null}" class="caja-proyecto">
                    <i class="fas fa-code-branch" style="color: #00f2ff; margin-right: 5px;"></i> 
                    <strong style="color: #ddd;">Proyecto destacado:</strong> 
                    <a th:href="@{/proyecto/{id}(id=${post.proyectoVinculado.id})}" target="_blank" th:text="${post.proyectoVinculado.titulo}" style="color: #00f2ff; text-decoration: none; font-weight: bold; margin-left: 5px;"></a>
                </div>
            </div>
            
            <div class="acciones-candidato">
                <span style="color: #888; font-size: 0.75rem; margin-bottom: 5px;" 
                      th:text="${#dates.format(post.fechaPostulacion, 'dd/MM/yyyy HH:mm')}"></span>
                
                <a th:href="@{/profileView/{username}(username=${post.desarrollador.username})}" class="btn-ver-perfil">
                    <i class="fas fa-user-circle"></i> VER PERFIL
                </a>

                <a th:if="${post.desarrollador.curriculum != null && !post.desarrollador.curriculum.isEmpty()}" 
                   th:href="@{${post.desarrollador.curriculum}}" target="_blank" class="btn-ver-cv">
                    <i class="fas fa-file-pdf"></i> CURRÍCULUM
                </a>

                <span th:unless="${post.desarrollador.curriculum != null && !post.desarrollador.curriculum.isEmpty()}" 
                      style="font-size: 0.8rem; color: #ff4444; margin-top: 5px; text-align: center; width: 100%;">
                    <i class="fas fa-times-circle"></i> Sin CV
                </span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(postulaciones)}" style="text-align: center; color: #666; margin-top: 50px; background: rgba(25,25,25,0.6); padding: 40px; border-radius: 10px; border: 1px dashed #444;">
            <i class="fas fa-user-slash fa-3x" style="color: #444;"></i>
            <p style="margin-top: 15px; font-size: 1.1rem; color: #888;">Aún no se ha postulado nadie a esta oferta.</p>
        </div>

    </main>

    <div th:replace="~{includes/footer :: footer}"></div>
</body>
</html>
