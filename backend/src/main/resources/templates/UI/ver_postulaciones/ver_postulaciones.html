<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Postulaciones</title>
    
    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/jobsearching_styles/jobsearching_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .candidato-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-candidato {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #FFCC00;
            object-fit: cover;
        }
        .mensaje-candidato {
            color: #aaa;
            font-style: italic;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .btn-ver-perfil {
            background: transparent;
            color: #00f2ff;
            border: 1px solid #00f2ff;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="body-layout fondo-oscuro-neon">

    <div th:replace="~{includes/header :: header}"></div>

    <main class="contenedor-principal-ofertas">
        
        <div style="margin-bottom: 30px; text-align: left; color: #FFCC00;">
        <a th:href="@{/mis-ofertas(empresa=${oferta.empresa.username})}" style="color: #888; text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-arrow-left"></i> Volver a mis ofertas
        </a>
            <h2 style="margin-top: 15px;">Candidatos para: <span th:text="${oferta.titulo}" style="color: white;"></span></h2>
        </div>

        <div th:each="post : ${postulaciones}" class="candidato-card">
            <img th:src="${post.desarrollador.fotoPerfil != null ? post.desarrollador.fotoPerfil : '/Img/default-avatar.png'}" class="avatar-candidato">
            
            <div style="flex: 1;">
                <h3 th:text="${post.desarrollador.username}" style="color: white; margin: 0;"></h3>
                <p class="mensaje-candidato" th:text="${post.mensajeAdjunto}"></p>
                
                <div th:if="${post.proyectoVinculado != null}" style="font-size: 0.8rem; color: #888;">
                    <i class="fas fa-link"></i> Proyecto vinculado: 
                    <a th:href="'/proyecto/' + ${post.proyectoVinculado.id}" th:text="${post.proyectoVinculado.titulo}" style="color: #FFCC00; text-decoration: none;"></a>
                </div>
            </div>
            
            <div style="text-align: right;">
                <span style="display: block; color: #666; font-size: 0.7rem; margin-bottom: 10px;" 
                      th:text="${#dates.format(post.fechaPostulacion, 'dd/MM/yyyy')}"></span>
                <a th:href="'/profile/' + ${post.desarrollador.username}" class="btn-ver-perfil">VER PERFIL</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(postulaciones)}" style="text-align: center; color: #666; margin-top: 50px;">
            <i class="fas fa-user-slash fa-3x"></i>
            <p style="margin-top: 15px;">Aún no se ha postulado nadie a esta oferta.</p>
        </div>

    </main>

    <div th:replace="~{includes/footer :: footer}"></div>
</body>
</html>
