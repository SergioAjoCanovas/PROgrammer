<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer - Reseñas de Proyecto</title>

    <link rel="stylesheet" href="/Style/general_styles/header.css">
    <link rel="stylesheet" href="/Style/general_styles/footer.css">
    <link rel="stylesheet" href="/Style/general_styles/general_styles.css">
    <link rel="stylesheet" href="/Style/viewprojectreviews/viewprojectreviews.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fondo-oscuro-neon">

<div th:replace="~{includes/header :: header}"></div>

<main class="contenedor-principal">

    <aside class="columna-perfil">
        <div class="tarjeta-perfil">
            <div class="cabecera-tarjeta">
                <div class="foto-perfil-contenedor">
                    <div class="circulo-foto"></div>
                    <div class="icono-corazon"><i class="fas fa-heart"></i></div>
                </div>
                <h2 class="nombre-usuario">Autor</h2>
            </div>

            <div class="cuerpo-tarjeta">
                <ul class="redes-sociales">
                    <li><i class="fab fa-instagram"></i> Instagram</li>
                    <li><i class="fab fa-twitter"></i> Twitter</li>
                    <li><i class="fas fa-phone"></i> Contacto</li>
                </ul>
                <button class="boton-curriculum">VER CV</button>
            </div>
        </div>
    </aside>

    <section class="seccion-central">

        <div class="tarjeta-proyecto-detalle">

            <div class="cabecera-proyecto">
                <h2>Nombre del Proyecto</h2>
                <a href="/projectview" class="boton-volver-circular">
                    <i class="fas fa-undo"></i>
                </a>
            </div>

            <p class="autor-texto">
                <strong>Desarrollado por:</strong> David Alcázar
            </p>

            <div class="medias-reseñas-ver">
                <div class="media-stat"><span>Arquitectura:</span><span>4.5</span></div>
                <div class="media-stat"><span>Limpieza:</span><span>4.0</span></div>
                <div class="media-stat"><span>Documentación:</span><span>5.0</span></div>
                <div class="media-total"><span>TOTAL:</span><span>4.5</span></div>
            </div>

            <div class="galeria-capturas">
                <div class="marco-captura">
                    <img src="/Img/stock/ejemplo1.jpg">
                </div>
            </div>

            <div class="bloque-texto-informativo">
                <h3>Descripción técnica</h3>
                <p>Descripción del proyecto...</p>
            </div>

        </div>

    </section>

    <aside class="zona-derecha">

        <div class="tarjeta-reseñas-ver">

            <div class="cabecera-tarjeta">
                <h3>FEEDBACK</h3>
            </div>

            <div class="contenedor-reseñas">

                <div class="reseña-item">
                    <div class="reseña-user">
                        <i class="fas fa-user-circle"></i>
                        Usuario1
                    </div>

                    <div class="reseña-scores">
                        <div>Arq: ⭐⭐⭐⭐</div>
                        <div>Lim: ⭐⭐⭐⭐</div>
                        <div>Doc: ⭐⭐⭐⭐⭐</div>
                    </div>

                    <p>Muy buen proyecto</p>
                </div>

            </div>

        </div>

    </aside>

</main>

<div th:replace="~{includes/footer :: footer}"></div>

</body>
</html>
