<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="footer">

    <footer class="footer-principal">

        <div class="footer-contenido">

            <div class="footer-seccion">
                <img th:src="@{/Img/logo_sin_silla_de_ruedas-removebg-preview.png}"
                     alt="Logotipo"
                     class="footer-logo">

                <div class="footer-texto">
                    <p>2026 ProGrammer</p>
                    <p>Cristian Escobar, David Alcázar, Sergio Ajo</p>
                </div>
            </div>

            <div class="footer-seccion footer-links">
                <a th:href="@{/nosotros}" id="footer-nosotros"> Sobre Nosotros</a>
                <a th:href="@{/privacidad}" id="footer-privacidad">Políticas de Privacidad</a>
                <a th:href="@{/terminos}" id="footer-terminos">Términos y Condiciones</a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=programmer.soporte@gmail.com&su=Soporte%20ProGrammer&body=Hola%20equipo%20de%20ProGrammer," 
                   target="_blank">
                    Contáctanos
                </a>
            </div>

            <div class="footer-seccion footer-redes">
                <a href="https://github.com/PROGrammer-Official/PROgrammer" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://www.instagram.com/proggrammer_official?igsh=MTY1b2lvaGNwM2hodQ==" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://x.com/progg_official" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512" fill="currentColor" style="vertical-align: -0.125em;"><path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"/></svg></a>
            </div>

        </div>

    </footer>

    <script>
        // Configurar el favicon de la pestaña
        (function() {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                link.type = 'image/png';
                document.getElementsByTagName('head')[0].appendChild(link);
            }
            link.href = '/Img/SILLARUEDASFONDOGRIS.png';
        })();

        document.addEventListener("DOMContentLoaded", function () {
            const path = window.location.pathname;
            
            if (path.includes('/nosotros')) {
                document.getElementById('footer-nosotros')?.classList.add('activo-footer');
            } else if (path.includes('/privacidad')) {
                document.getElementById('footer-privacidad')?.classList.add('activo-footer');
            } else if (path.includes('/terminos')) {
                document.getElementById('footer-terminos')?.classList.add('activo-footer');
            }
        });
    </script>
</div>

</html>
