<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer Header</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .activo-btn, .activo-btn i, .activo-btn span {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8) !important;
        }

        .contenedor-avisos {
            position: relative;
            display: inline-block;
        }

        .panel-notificaciones {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 280px;
            background: #1a1a1a;
            border: 1px solid #FFCC00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            border-radius: 8px;
            margin-top: 10px;
            z-index: 1000;
            padding: 10px;
        }

        .panel-notificaciones.mostrar {
            display: block;
        }

        .notificacion-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            color: white;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notificacion-item:last-child {
            border-bottom: none;
        }

        .notificacion-item i {
            color: #00f2ff;
        }

        .titulo-panel {
            color: #FFCC00;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #FFCC00;
            display: block;
        }

        .seccion-derecha {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }
    </style>
</head>

<body>

<header th:fragment="header" class="encabezado-principal">

    <div class="seccion-izquierda">
        <div class="contenedor-logotipo">
            <a href="/main">
                <img src="/Img/SILLARUEDASFONDOGRIS.png" class="imagen-logotipo">
            </a>
        </div>
    </div>

    <nav class="navegacion-central">

        <a href="/main" class="icono-nav" id="nav-inicio">
            <i class="fas fa-home"></i>
            <span class="texto-icono">Inicio</span>
        </a>

        <a href="/searchProgrammer" class="icono-nav">
            <i class="fas fa-users"></i>
            <span class="texto-icono">Red</span>
        </a>

        <a href="/jobsearching" class="icono-nav">
            <i class="fas fa-briefcase"></i>
            <span class="texto-icono">Empleos</span>
        </a>

        <a href="/publishOffer"
           class="icono-nav"
           th:if="${usuarioHeader != null and usuarioHeader.rol.nombre == 'COMPANY'}"
           id="nav-publicar-oferta">
            <i class="fas fa-plus-circle"></i>
            <span class="texto-icono">Publicar</span>
        </a>

        <a href="/chats" class="icono-nav">
            <i class="fas fa-comment"></i>
            <span class="texto-icono">Chats</span>
        </a>

        <div class="contenedor-avisos" onmouseleave="cerrarPanel()">
            <a href="#" class="icono-nav" id="link-avisos" onclick="toggleAvisos(event)">
                <i class="fas fa-bell"></i>
                <span class="texto-icono">Avisos</span>
                <span class="globo-notificacion">2</span>
            </a>

            <div id="panel-notificaciones" class="panel-notificaciones">
                <span class="titulo-panel">Notificaciones recientes</span>

                <div class="notificacion-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Nueva oferta de TechSolutions</span>
                </div>

                <div class="notificacion-item">
                    <i class="fas fa-user-plus"></i>
                    <span>Juan ha visto tu perfil</span>
                </div>
            </div>
        </div>

        <a href="/menu" class="icono-nav">
            <i class="fas fa-th"></i>
            <span class="texto-icono">Menú</span>
        </a>

    </nav>

    <div class="seccion-derecha">

        <a href="/login" class="btn-logout" onclick="cerrarSesionLocal(event)" 
           style="text-decoration: none; display: flex; flex-direction: row; align-items: center; gap: 8px; margin-right: 30px;">
            
            <i class="fas fa-sign-out-alt btn-logout-icon"></i>
            <span class="texto-icono btn-logout-texto">Cerrar Sesión</span>

            <style>
                .btn-logout-icon {
                    color: #ffffff; 
                    font-size: 1.2rem;
                    transition: all 0.3s ease;
                }
                .btn-logout-texto {
                    color: #ffffff; 
                    transition: all 0.3s ease;
                    white-space: nowrap; /* Evita que el texto se rompa en dos líneas */
                }

                /* Hover: Icono y Texto cambian a rojo */
                .btn-logout:hover .btn-logout-icon {
                    color: #ff0000 !important;
                    text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
                    transform: scale(1.1);
                }
                
                .btn-logout:hover .btn-logout-texto {
                    color: #ff0000 !important;
                }
            </style>
        </a>

        <div th:if="${usuarioHeader != null}" class="info-texto-usuario">
            <div style="display:flex;flex-direction:column;text-align:right;line-height:1.2;margin-right:10px;">
                <span style="color:white;font-weight:bold;font-size:0.85em;"
                      th:text="${#strings.toUpperCase(usuarioHeader.username)}"></span>

                <span style="color:#FFCC00;font-size:0.65em;font-weight:600;"
                      th:text="${#strings.toUpperCase(usuarioHeader.rol.nombre)}"></span>
            </div>
        </div>

        <a href="/ownProfile" class="item-derecha">
            <div class="avatar-usuario">
                <img th:if="${usuarioHeader != null and usuarioHeader.fotoPerfil != null and usuarioHeader.fotoPerfil != ''}"
                     th:src="@{${usuarioHeader.fotoPerfil}}"/>

                <i th:if="${usuarioHeader == null or usuarioHeader.fotoPerfil == null or usuarioHeader.fotoPerfil == ''}"
                   class="fas fa-user"></i>
            </div>
            <span class="texto-icono">Perfil</span>
        </a>

    </div>

</header>

<script>
function toggleAvisos(event) {
    event.preventDefault();
    document.getElementById('panel-notificaciones').classList.toggle('mostrar');
    document.getElementById('link-avisos').classList.toggle('activo-btn');
}

function cerrarPanel() {
    const panel = document.getElementById('panel-notificaciones');
    const link = document.getElementById('link-avisos');
    if(panel) panel.classList.remove('mostrar');
    if(link) link.classList.remove('activo-btn');
}

function cerrarSesionLocal(event) {
    event.preventDefault();
    localStorage.removeItem('usuarioLogueado');
    localStorage.removeItem('rolUsuario');
    window.location.href = "/login";
}

document.addEventListener("DOMContentLoaded", function () {
    const path = window.location.pathname;
    if (path === '/main') {
        document.getElementById('nav-inicio')?.classList.add('activo-btn');
    }
});

(function configurarHeader() {
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user') || localStorage.getItem('usuarioLogueado');
    const rol = params.get('rol') || localStorage.getItem('rolUsuario');

    if (params.get('user')) {
        localStorage.setItem('usuarioLogueado', params.get('user'));
        localStorage.setItem('rolUsuario', params.get('rol') || '2'); 
    }

    const btnPublicar = document.getElementById('nav-publicar-oferta');
    if (rol && btnPublicar) {
        const r = String(rol).trim().toUpperCase();
        btnPublicar.style.display = (r === 'COMPANY' || r === '3') ? 'flex' : 'none';
    }

    const contenedorInfo = document.getElementById('info-usuario');
    if (username && contenedorInfo) {
        let nombreRol = rol;
        if (rol == '1') nombreRol = 'ADMIN';
        if (rol == '2') nombreRol = 'DEVELOPER';
        if (rol == '3') nombreRol = 'COMPANY';

        contenedorInfo.innerHTML = `
            <div style="display: flex; flex-direction: column; text-align: right; margin-right: 12px; justify-content: center; line-height: 1.2;">
                <span style="color: white; font-weight: bold; font-size: 0.85em;">${username.toUpperCase()}</span>
                <span style="color: #FFCC00; font-size: 0.65em; text-transform: uppercase; font-weight: 600;">${nombreRol}</span>
            </div>
        `;
    }
})();
</script>

</body>
</html>
