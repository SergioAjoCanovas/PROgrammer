<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGrammer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .activo-btn {
            color: #FFCC00 !important;
        }
        .activo-btn i {
            color: #FFCC00 !important;
            text-shadow: 0 0 10px #FFCC00;
        }
    </style>
</head>
<body>

<header class="encabezado-principal">

    <div class="seccion-izquierda">
        <div class="contenedor-logotipo">
            <a href="/main">
                <img src="/Img/SILLARUEDASFONDOGRIS.png" alt="Logotipo ProGrammer" class="imagen-logotipo">
            </a>
        </div>
    </div>

    <nav class="navegacion-central">

        <a href="/main" class="icono-nav">
            <i class="fas fa-home"></i>
            <span class="texto-icono">Inicio</span>
        </a>

        <a href="/searchProgrammer" class="icono-nav">
            <i class="fas fa-users"></i>
            <span class="texto-icono">Red</span>
        </a>

        <a href="/jobsearching" class="icono-nav">
            <i class="fas fa-briefcase"></i>
            <span class="texto-icono">Empleos</span>
        </a>

        <a href="/chats" class="icono-nav">
            <i class="fas fa-comment"></i>
            <span class="texto-icono">Chats</span>
        </a>

        <div class="contenedor-avisos" id="contenedor-avisos"
             onmouseleave="document.getElementById('panel-notificaciones').classList.remove('activo');
             document.getElementById('link-avisos').classList.remove('activo-btn');">

            <a href="#" class="icono-nav" id="link-avisos"
               onclick="event.preventDefault();
               document.getElementById('panel-notificaciones').classList.toggle('activo');
               this.classList.toggle('activo-btn');">

                <i class="fas fa-bell"></i>
                <span class="texto-icono">Avisos</span>
                <span class="globo-notificacion">2</span>
            </a>

            <div class="panel-notificaciones" id="panel-notificaciones">
                <div class="cabecera-notificaciones">
                    <h4>Avisos</h4>
                    <a href="#" class="marcar-leido"><i class="fas fa-check-double"></i> Leídos</a>
                </div>

                <div class="lista-notificaciones">
                    <div class="item-notificacion no-leido">
                        <div class="icono-noti empresa"><i class="fas fa-briefcase"></i></div>
                        <div class="texto-noti">
                            <p><strong>Tech Corp</strong> ha visto tu perfil.</p>
                        </div>
                    </div>

                    <div class="item-notificacion no-leido">
                        <div class="icono-noti chat"><i class="fas fa-comment"></i></div>
                        <div class="texto-noti">
                            <p>Nuevo mensaje de <strong>Carlos Dev</strong>.</p>
                        </div>
                    </div>

                    <div class="item-notificacion">
                        <div class="icono-noti sistema"><i class="fas fa-cog"></i></div>
                        <div class="texto-noti">
                            <p>Proyecto publicado correctamente.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <a href="/menu" class="icono-nav">
            <i class="fas fa-th"></i>
            <span class="texto-icono">Menú</span>
        </a>

    </nav>

    <div class="seccion-derecha">

        <div id="info-usuario" style="display: flex; flex-direction: column; text-align: right; justify-content: center;"></div>

        <a href="/login" class="item-derecha">
            <div class="avatar-usuario">
                <i class="fas fa-user"></i>
            </div>
            <span class="texto-icono">Perfil</span>
        </a>

        <button class="item-derecha"
                onclick="window.location.href='/ownProfile'">
            <i class="fas fa-cog icono-engranaje"></i>
            <span class="texto-icono">Ajustes</span>
        </button>

    </div>

</header>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const username = localStorage.getItem('usuarioLogueado');
        const rol = localStorage.getItem('rolUsuario');

        if (username) {
            document.getElementById('info-usuario').innerHTML = `
                <span style="color: white; font-weight: bold; font-size: 0.9em;">${username}</span>
                <span style="color: #FFCC00; font-size: 0.7em; text-transform: uppercase;">${rol}</span>
            `;
        }
    });
</script>

</body>
</html>
